<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TIDTANG — อนุมัติการลา</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --deep:    #191919;
  --dark:    #242424;
  --mid:     #2e2e2e;
  --border:  #383838;
  --off:     #EBE7E4;
  --cream:   #C8B8A2;
  --muted:   #888;
  --white:   #F5F2EE;
  --green:   #4caf50;
  --red:     #e03535;
  --amber:   #e8a020;
  --teal:    #5eead4;
  --radius:  10px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Anuphan', sans-serif;
  background: var(--deep);
  color: var(--off);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Loading ── */
.loading {
  position: fixed; inset: 0;
  background: var(--deep);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; z-index: 100;
}
.loading-dot {
  width: 40px; height: 40px;
  border: 2px solid var(--border);
  border-top-color: var(--cream);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 12px; color: var(--muted); letter-spacing: .1em; }

/* ── Header ── */
.header {
  background: var(--dark);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 14px;
  position: sticky; top: 0; z-index: 10;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.header-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--cream);
}
.header-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; color: var(--muted);
}
.header-title { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }

/* ── Empty ── */
.empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; padding: 40px;
  text-align: center;
}
.empty-icon { font-size: 48px; opacity: .4; }
.empty-text { font-size: 14px; color: var(--muted); line-height: 1.6; }

/* ── Request List ── */
.list { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* ── Request Card ── */
.req-card {
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .2s;
}
.req-card.approved { border-color: var(--green); opacity: .6; }
.req-card.rejected { border-color: var(--red); opacity: .6; }
.req-card.info-req  { border-color: var(--amber); opacity: .6; }

.req-header {
  padding: 14px 16px 10px;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 10px;
}
.req-avatar {
  width: 40px; height: 40px;
  background: var(--mid);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800;
  color: var(--cream); flex-shrink: 0;
  border: 1px solid var(--border);
}
.req-meta { flex: 1; min-width: 0; }
.req-name { font-size: 15px; font-weight: 700; }
.req-pos  { font-size: 11px; color: var(--muted); margin-top: 1px; }
.req-id   {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--muted);
  background: var(--mid); padding: 2px 7px;
  border-radius: 3px; white-space: nowrap;
}

.req-body { padding: 0 16px 14px; }

/* Type badge */
.type-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px; font-weight: 700;
  margin-bottom: 12px;
}
.type-sick    { background: rgba(224,53,53,.15); color: #f87171; }
.type-vacation{ background: rgba(94,234,212,.12); color: var(--teal); }
.type-personal{ background: rgba(200,184,162,.12); color: var(--cream); }
.type-wfh     { background: rgba(100,150,255,.12); color: #93bbff; }
.type-over    { background: rgba(232,160,32,.12); color: var(--amber); }
.type-lwp     { background: rgba(150,150,150,.12); color: #aaa; }

.req-info-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 12px;
}
.req-info-item {}
.req-info-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 3px;
}
.req-info-value { font-size: 13px; font-weight: 600; }

/* Reason box */
.req-reason {
  background: var(--mid);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 14px;
}
.req-reason-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--cream); margin-bottom: 4px;
}

/* Quota mini */
.req-quota {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: var(--mid);
  border-radius: 6px;
  font-size: 12px;
  margin-bottom: 14px;
}
.req-quota-bar {
  flex: 1; height: 4px;
  background: var(--border); border-radius: 2px;
  overflow: hidden;
}
.req-quota-fill { height: 100%; border-radius: 2px; transition: width .3s; }

/* Action buttons */
.req-actions { display: flex; gap: 8px; }

.btn-action {
  flex: 1; padding: 11px 8px;
  border: none; border-radius: 6px;
  font-family: 'Anuphan', sans-serif;
  font-size: 13px; font-weight: 700;
  cursor: pointer; transition: opacity .15s, transform .1s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-action:active { transform: scale(.97); opacity: .8; }

.btn-approve { background: var(--green); color: #fff; }
.btn-reject  { background: var(--red); color: #fff; }
.btn-info    { background: var(--mid); color: var(--amber); border: 1px solid var(--amber); flex: 0 0 auto; padding: 11px 14px; }

/* Done badge */
.done-badge {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px;
  border-radius: 6px;
  font-size: 13px; font-weight: 700;
}
.done-approved { background: rgba(76,175,80,.12); color: var(--green); }
.done-rejected { background: rgba(224,53,53,.12); color: var(--red); }
.done-info     { background: rgba(232,160,32,.12); color: var(--amber); }

/* ── Info Request Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  display: flex; align-items: flex-end;
  z-index: 50;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  width: 100%;
  background: var(--dark);
  border-radius: 16px 16px 0 0;
  padding: 20px;
  transform: translateY(100%);
  transition: transform .3s ease;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-title {
  font-size: 16px; font-weight: 700;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.modal-textarea {
  width: 100%;
  background: var(--mid);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  color: var(--off);
  font-family: 'Anuphan', sans-serif;
  font-size: 14px;
  resize: none; height: 100px;
  margin-bottom: 12px;
}
.modal-textarea:focus { outline: none; border-color: var(--cream); }
.modal-actions { display: flex; gap: 10px; }
.btn-modal-cancel { flex: 1; padding: 12px; background: var(--mid); border: none; border-radius: 8px; color: var(--off); font-family: 'Anuphan', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-modal-send   { flex: 2; padding: 12px; background: var(--amber); border: none; border-radius: 8px; color: #191919; font-family: 'Anuphan', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }

/* ── Error ── */
.error-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; padding: 40px; text-align: center;
}
.error-screen h2 { font-size: 18px; }
.error-screen p  { font-size: 13px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-dot"></div>
  <div class="loading-text">กำลังโหลดคำขอ...</div>
</div>

<div class="header" id="header" style="display:none">
  <div class="header-top">
    <div class="header-tag">TIDTANG STUDIO · APPROVE</div>
    <div class="header-count" id="header-count"></div>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <button id="back-btn" onclick="switchTab('pending')" style="display:none; background:none; border:none; color:var(--cream); font-family:'Anuphan',sans-serif; font-size:13px; cursor:pointer; padding:0;">← กลับ</button>
    <div class="header-title" id="header-title-text">คำขอรออนุมัติ</div>
  </div>
</div>


<div id="main-content" style="display:none; flex:1; display:none; flex-direction:column;"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title">💬 ขอข้อมูลเพิ่มเติม</div>
    <textarea class="modal-textarea" id="modal-input" placeholder="ระบุข้อมูลที่ต้องการ..."></textarea>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-modal-send" onclick="sendInfoRequest()">ส่งข้อความ</button>
    </div>
  </div>
</div>

<div class="error-screen" id="error-screen" style="display:none">
  <div style="font-size:40px">🔒</div>
  <h2>ไม่มีสิทธิ์เข้าถึง</h2>
  <p id="error-msg">ระบบ Approve สำหรับ Senior, Head และ HR เท่านั้นค่ะ</p>
</div>

<script>
const LIFF_ID    = "2010134572-aaIB6Anr";
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyzyQ3I-Omw4gwLjVIUEwe7q5iQFZTpp6xs3e4QkX68ngkmlQKP8j5qbKl3mCvgu3qz5w/exec";

let userId   = null;
let approver = null;
let requests = [];
let currentInfoReqId = null;
let currentInfoEmpId = null;

// ── Type config ────────────────────────────────────────────────
const TYPE_CONFIG = {
  "ลาป่วย":         { cls: "type-sick",     icon: "🤒" },
  "ลาพักร้อน":      { cls: "type-vacation", icon: "🏖" },
  "ลากิจ":          { cls: "type-personal", icon: "📋" },
  "WFH":             { cls: "type-wfh",      icon: "🏠" },
  "ลาเกินโควต้า":   { cls: "type-over",     icon: "⚠️" },
  "Leave Without Pay":{ cls: "type-lwp",    icon: "📌" },
};

// ── Init ───────────────────────────────────────────────────────
async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    const profile = await liff.getProfile();
    userId = profile.userId;

    const res  = await fetch(`${WEBAPP_URL}?action=getEmployee&userId=${userId}`);
    const data = await res.json();

    if (!data.success || !data.emp) {
      showError("ไม่พบข้อมูลพนักงานในระบบค่ะ");
      return;
    }

    approver = data.emp;
    // Head/HR/Senior/Admin เข้าได้ทั้งหมด (Admin ดูอย่างเดียว)
    const canEnter = ["Full Access","Senior","HR","Admin"].includes(approver.role);
    if (!canEnter) {
      showError(`คุณ${approver.nick} (${approver.role}) ไม่มีสิทธิ์เข้าถึงหน้านี้ค่ะ`);
      return;
    }

    await loadPendingRequests();

  } catch (err) {
    console.error(err);
    showError("เกิดข้อผิดพลาด กรุณาลองใหม่ค่ะ");
  } finally {
    hide("loading");
  }
}

// ── Load pending requests — 2 phase ───────────────────────────
async function loadPendingRequests() {
  try {
    // Phase 1: โหลดเฉพาะ รออนุมัติ → แสดงทันที
    const res1  = await fetch(`${WEBAPP_URL}?action=getPendingRequests&userId=${userId}&filter=pending`);
    const data1 = await res1.json();

    if (!data1.success) { showError(data1.msg || "โหลดคำขอไม่สำเร็จค่ะ"); return; }

    requests = data1.requests || [];
    show("header");
    show("main-content");
    document.getElementById("main-content").style.display = "flex";
    document.getElementById("main-content").style.flexDirection = "column";
    document.getElementById("tabs").style.display = "flex";
    renderRequests();

    // Phase 2: โหลด อนุมัติแล้ว → เพิ่ม background
    const res2  = await fetch(`${WEBAPP_URL}?action=getPendingRequests&userId=${userId}&filter=done`);
    const data2 = await res2.json();
    if (data2.success) {
      requests = [...requests, ...(data2.requests || [])];
      // อัปเดต header count
      const pending = requests.filter(r => r.status === "รออนุมัติ").length;
      document.getElementById("header-count").textContent =
        pending > 0 ? `รอ ${pending} รายการ` : "ครบแล้ว ✅";
    }

  } catch (err) {
    showError("เชื่อมต่อระบบไม่ได้ค่ะ");
  }
}

// ── Render ─────────────────────────────────────────────────────
function renderRequests() {
  const count = requests.filter(r => r.status === "รออนุมัติ").length;
  document.getElementById("header-count").textContent = `${count} รายการ`;

  const main = document.getElementById("main-content");

  if (requests.length === 0) {
    main.innerHTML = `
      <div class="empty">
        <div class="empty-icon">✅</div>
        <div class="empty-text">ไม่มีคำขอรออนุมัติค่ะ<br>ทุกอย่างเรียบร้อยแล้ว</div>
      </div>`;
    return;
  }

  const list = document.createElement("div");
  list.className = "list";

  requests.forEach((req, idx) => {
    list.appendChild(buildCard(req, idx));
  });

  main.innerHTML = "";
  main.appendChild(list);
}

function buildCard(req, idx) {
  const tc       = TYPE_CONFIG[req.leaveType] || { cls: "type-wfh", icon: "📄" };
  const isPending = req.status === "รออนุมัติ";
  const initials  = (req.empNick || "?").substring(0, 2).toUpperCase();
  const quota     = req.quota;
  const quotaPct  = quota ? Math.min(100, Math.round((quota.left / quota.total) * 100)) : null;
  const barColor  = quotaPct > 50 ? "#4caf50" : quotaPct > 20 ? "#e8a020" : "#e03535";

  const card = document.createElement("div");
  card.className = `req-card${!isPending ? " " + (req.status === "อนุมัติ" ? "approved" : req.status === "ไม่อนุมัติ" ? "rejected" : "info-req") : ""}`;
  card.id = `card-${idx}`;

  card.innerHTML = `
    <div class="req-header">
      <div class="req-avatar">${initials}</div>
      <div class="req-meta">
        <div class="req-name">${req.empNick || "—"}</div>
        <div class="req-pos">${req.empPos || ""} · ${req.empDept || ""}</div>
      </div>
      <div class="req-id">${req.reqId || ""}</div>
    </div>

    <div class="req-body">
      <div class="type-badge ${tc.cls}">${tc.icon} ${req.leaveType}</div>

      <div class="req-info-grid">
        <div class="req-info-item">
          <div class="req-info-label">วันที่</div>
          <div class="req-info-value">${req.dateRange || "—"}</div>
        </div>
        <div class="req-info-item">
          <div class="req-info-label">จำนวน</div>
          <div class="req-info-value">${req.days || "—"} วัน</div>
        </div>
        <div class="req-info-item">
          <div class="req-info-label">ส่งเมื่อ</div>
          <div class="req-info-value">${req.submittedAt || "—"}</div>
        </div>
        <div class="req-info-item">
          <div class="req-info-label">ผู้อนุมัติ</div>
          <div class="req-info-value">${(req.approvers || []).join(", ") || "—"}</div>
        </div>
      </div>

      ${req.reason ? `
      <div class="req-reason">
        <div class="req-reason-label">เหตุผล</div>
        ${req.reason}
      </div>` : ""}

      ${quotaPct !== null ? `
      <div class="req-quota">
        <span style="font-size:12px;color:var(--muted)">โควต้าคงเหลือ ${quota.left}/${quota.total} วัน</span>
        <div class="req-quota-bar">
          <div class="req-quota-fill" style="width:${quotaPct}%;background:${barColor}"></div>
        </div>
      </div>` : ""}

      ${isPending && req.canApprove ? `
      <div class="req-actions">
        <button class="btn-action btn-approve" onclick="approve(${idx})">✓ อนุมัติ</button>
        <button class="btn-action btn-reject"  onclick="reject(${idx})">✗ ปฏิเสธ</button>
        <button class="btn-action btn-info"    onclick="requestInfo(${idx})">💬</button>
      </div>` : isPending && !req.canApprove ? `
      <div class="done-badge" style="background:rgba(200,184,162,.08);color:var(--cream)">
        👁 รออนุมัติจาก ${(req.approvers||[]).join(", ")}
      </div>` : `
      <div class="done-badge ${req.status === "อนุมัติ" ? "done-approved" : req.status === "ไม่อนุมัติ" ? "done-rejected" : "done-info"}">
        ${req.status === "อนุมัติ" ? "✅ อนุมัติแล้ว" : req.status === "ไม่อนุมัติ" ? "✗ ปฏิเสธแล้ว" : "💬 ขอข้อมูลเพิ่ม"}
        ${req.approvedBy ? `· ${req.approvedBy}` : ""}
      </div>`}
    </div>`;

  return card;
}

// ── Actions ────────────────────────────────────────────────────
async function approve(idx) {
  const req = requests[idx];
  if (!confirm(`อนุมัติการลาของ ${req.empNick}?\n${req.leaveType} · ${req.dateRange}`)) return;
  await submitDecision(idx, "approve", "");
}

async function reject(idx) {
  const reason = prompt(`เหตุผลในการปฏิเสธ (${requests[idx].empNick}):`) || "";
  await submitDecision(idx, "reject", reason);
}

function requestInfo(idx) {
  const req = requests[idx];
  currentInfoReqId = req.reqId;
  currentInfoEmpId = req.empLineId;
  document.getElementById("modal-input").value = "";
  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
  currentInfoReqId = null;
  currentInfoEmpId = null;
}

async function sendInfoRequest() {
  const msg = document.getElementById("modal-input").value.trim();
  if (!msg) { alert("กรุณาระบุข้อมูลที่ต้องการค่ะ"); return; }
  closeModal();

  try {
    const res  = await fetch(WEBAPP_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "requestMoreInfo",
        userId, reqId: currentInfoReqId,
        empLineId: currentInfoEmpId, message: msg
      })
    });
    const data = await res.json();
    if (data.success) {
      const req = requests.find(r => r.reqId === currentInfoReqId);
      if (req) { req.status = "ขอข้อมูลเพิ่ม"; renderRequests(); }
      alert("ส่งข้อความแล้วค่ะ");
    }
  } catch (err) {
    alert("เกิดข้อผิดพลาดค่ะ");
  }
}

async function submitDecision(idx, action, reason) {
  const req = requests[idx];
  const card = document.getElementById(`card-${idx}`);
  if (card) card.style.opacity = ".5";

  try {
    const res  = await fetch(WEBAPP_URL, {
      method: "POST",
      body: JSON.stringify({
        action: action === "approve" ? "approveLeave" : "rejectLeave",
        userId, reqId: req.reqId,
        empLineId: req.empLineId, reason
      })
    });
    const data = await res.json();

    if (data.success) {
      req.status     = action === "approve" ? "อนุมัติ" : "ไม่อนุมัติ";
      req.approvedBy = approver.nick;
      renderRequests();
    } else {
      if (card) card.style.opacity = "1";
      alert(data.msg || "เกิดข้อผิดพลาดค่ะ");
    }
  } catch (err) {
    if (card) card.style.opacity = "1";
    alert("เชื่อมต่อไม่ได้ค่ะ");
  }
}

// ── Helpers ────────────────────────────────────────────────────
function show(id) { const el = document.getElementById(id); if (el) el.style.display = "block"; }
function hide(id) { const el = document.getElementById(id); if (el) el.style.display = "none"; }

function showError(msg) {
  hide("loading"); hide("header"); hide("main-content");
  document.getElementById("error-msg").textContent = msg;
  show("error-screen");
}

// ── Start ──────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  function waitLiff(cb) {
    if (typeof liff !== "undefined") cb();
    else setTimeout(() => waitLiff(cb), 100);
  }
  waitLiff(init);
});
</script>
</body>
