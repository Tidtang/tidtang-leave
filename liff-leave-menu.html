<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TIDTANG — แจ้งวันลา</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --bg:#eae7e4;--card:#fff;--deep:#191919;--border:#e0dbd6;
  --cream:#C8B8A2;--muted:#999;--red:#e03535;--amber:#e8a020;
  --blue:#3b82f6;--pink:#ec4899;--green:#4caf50;--r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Anuphan',sans-serif;background:var(--bg);min-height:100vh;padding-bottom:40px}

.loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.spin{width:24px;height:24px;border:1.5px solid #ccc;border-top-color:#555;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Header */
.header{padding:20px 20px 8px}
.header-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.header-title{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--deep)}

/* Quota bar */
.quota-wrap{margin:0 16px 8px;background:var(--card);border-radius:var(--r);padding:16px 18px;border:1px solid var(--border)}
.quota-title{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.quota-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.quota-row:last-child{margin-bottom:0}
.quota-label{font-size:12px;color:#555}
.quota-num{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500}
.quota-bar{height:3px;background:#f0ede9;border-radius:2px;margin-top:3px}
.quota-fill{height:100%;border-radius:2px;transition:width .4s ease}

/* Leave type cards */
.leave-grid{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.leave-card{
  background:var(--card);border-radius:var(--r);
  padding:18px 20px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;transition:all .15s;text-decoration:none;
  -webkit-user-select:none;user-select:none;
}
.leave-card:active{transform:scale(.98);opacity:.85}
.leave-card.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.leave-left{display:flex;align-items:center;gap:14px}
.leave-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leave-name{font-size:15px;font-weight:600;color:var(--deep);margin-bottom:2px}
.leave-sub{font-size:11px;color:var(--muted)}
.leave-arrow{font-size:14px;color:#ccc}
.leave-badge{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  padding:3px 8px;border-radius:20px;
  background:#f5f3f0;color:var(--muted);
}
.leave-badge.ok{background:rgba(76,175,80,.1);color:var(--green)}
.leave-badge.warn{background:rgba(232,160,32,.1);color:var(--amber)}
.leave-badge.no{background:rgba(224,53,53,.08);color:var(--red)}

/* Notice */
.notice{
  margin:0 16px;padding:12px 14px;border-radius:10px;
  background:rgba(232,160,32,.08);border:1px solid rgba(232,160,32,.2);
  font-size:12px;color:#8a6820;line-height:1.6;
}
.notice-title{font-weight:700;margin-bottom:2px}

/* Section label */
.sec{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:16px 20px 8px}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="spin"></div></div>

<div id="app" style="display:none">
  <div class="header">
    <div class="header-tag">TIDTANG STUDIO</div>
    <div class="header-title">แจ้งวันลา</div>
  </div>

  <!-- Quota summary -->
  <div class="sec">โควต้าคงเหลือ</div>
  <div class="quota-wrap" id="quota-wrap" style="display:none">
    <div id="quota-rows"></div>
  </div>

  <!-- Notice if not eligible for vacation -->
  <div class="notice" id="vacation-notice" style="display:none">
    <div class="notice-title">สิทธิ์ลาพักร้อน</div>
    ยังไม่ครบ 1 ปี นับจากวันเริ่มงาน ยังไม่มีสิทธิ์ลาพักร้อนค่ะ
  </div>

  <!-- Leave types -->
  <div class="sec">เลือกประเภทการลา</div>
  <div class="leave-grid">

    <!-- ลาป่วย -->
    <a class="leave-card" id="card-sick" href="#" onclick="goLeave('ลาป่วย');return false">
      <div class="leave-left">
        <div class="leave-dot" style="background:var(--red)"></div>
        <div>
          <div class="leave-name">ลาป่วย</div>
          <div class="leave-sub">ไม่ต้องรออนุมัติ · บันทึกอัตโนมัติ</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="leave-badge" id="badge-sick"></span>
        <span class="leave-arrow">›</span>
      </div>
    </a>

    <!-- ลากิจ -->
    <a class="leave-card" id="card-personal" href="#" onclick="goLeave('ลากิจ');return false">
      <div class="leave-left">
        <div class="leave-dot" style="background:var(--amber)"></div>
        <div>
          <div class="leave-name">ลากิจ</div>
          <div class="leave-sub">ต้องรออนุมัติจากผู้บังคับบัญชา</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="leave-badge" id="badge-personal"></span>
        <span class="leave-arrow">›</span>
      </div>
    </a>

    <!-- ลาพักร้อน -->
    <div class="leave-card" id="card-vacation" onclick="goLeave('ลาพักร้อน')">
      <div class="leave-left">
        <div class="leave-dot" style="background:var(--blue)"></div>
        <div>
          <div class="leave-name">ลาพักร้อน</div>
          <div class="leave-sub" id="vacation-sub">ต้องรออนุมัติ</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="leave-badge" id="badge-vacation"></span>
        <span class="leave-arrow">›</span>
      </div>
    </div>

    <!-- Emergency Leave -->
    <a class="leave-card" id="card-emg" href="#" onclick="goLeave('ลาฉุกเฉินพิเศษ');return false">
      <div class="leave-left">
        <div class="leave-dot" style="background:var(--pink)"></div>
        <div>
          <div class="leave-name">Emergency Leave</div>
          <div class="leave-sub">ลาฉุกเฉิน · ต้องรออนุมัติ</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="leave-arrow">›</span>
      </div>
    </a>

  </div>
</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwx-5qK1LrU7RjkaleQVYQ5GVCCe9Ab3_uoC7zE9gtj_0dKoXf86PyiHOhFmBVeN3Zm4g/exec";
const LEAVE_LIFF = "https://liff.line.me/2010134572-IRYeubTe";
const LIFF_ID    = "LEAVE_MENU_LIFF_ID"; // ← ใส่ LIFF ID ใหม่

let userId = null;
let empData = null;

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const p = await liff.getProfile();
    userId = p.userId;

    const res  = await fetch(`${WEBAPP_URL}?action=getEmployee&userId=${encodeURIComponent(userId)}`);
    const data = await res.json();

    if (!data.success) {
      document.getElementById("loading").innerHTML =
        `<div style="font-size:13px;color:#888;padding:32px;text-align:center">${data.msg}</div>`;
      return;
    }

    empData = data.emp;
    renderQuota(data.quota, data.emp);

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "";
  } catch(err) {
    document.getElementById("loading").innerHTML =
      `<div style="font-size:12px;color:#aaa;padding:32px;text-align:center">${err.message}</div>`;
  }
}

function renderQuota(q, emp) {
  if (!q) return;

  const eligible = hasCompletedOneYear(emp.startDate);

  // Quota display
  const rows = [
    { label: "ลาป่วย",     used: q.sickUsed,     left: q.sickLeft,     total: (q.sickUsed||0)+(q.sickLeft||0),  color: "#e03535", badgeId: "badge-sick"     },
    { label: "ลากิจ",      used: q.personalUsed,  left: q.personalLeft,  total: (q.personalUsed||0)+(q.personalLeft||0), color: "#e8a020", badgeId: "badge-personal" },
    { label: "ลาพักร้อน", used: q.vacationUsed,  left: q.vacationLeft,  total: (q.vacationUsed||0)+(q.vacationLeft||0), color: "#3b82f6", badgeId: "badge-vacation" },
  ];

  let html = "";
  rows.forEach(r => {
    const pct = r.total > 0 ? Math.max(0, Math.min(100, ((r.left||0) / r.total) * 100)) : 0;
    html += `
      <div class="quota-row">
        <span class="quota-label">${r.label}</span>
        <span class="quota-num" style="color:${r.color}">${r.left ?? "—"} วัน</span>
      </div>
      <div class="quota-bar" style="margin-bottom:10px">
        <div class="quota-fill" style="width:${pct}%;background:${r.color}"></div>
      </div>`;

    // Set badge
    const badge = document.getElementById(r.badgeId);
    if (badge) {
      const left = r.left ?? 0;
      if (left > 0) {
        badge.textContent = `${left} วัน`;
        badge.className = "leave-badge ok";
      } else {
        badge.textContent = "หมดโควต้า";
        badge.className = "leave-badge no";
      }
    }
  });

  document.getElementById("quota-rows").innerHTML = html;
  document.getElementById("quota-wrap").style.display = "block";

  // Vacation eligibility
  if (!eligible) {
    document.getElementById("vacation-notice").style.display = "block";
    const card = document.getElementById("card-vacation");
    card.classList.add("disabled");
    document.getElementById("vacation-sub").textContent = "ยังไม่ครบ 1 ปี · ยังไม่มีสิทธิ์";
    document.getElementById("badge-vacation").textContent = "ยังไม่มีสิทธิ์";
    document.getElementById("badge-vacation").className = "leave-badge no";
  } else {
    const vLeft = q.vacationLeft ?? 0;
    document.getElementById("vacation-sub").textContent = vLeft > 0 ? "ต้องรออนุมัติ" : "โควต้าหมดแล้วค่ะ";
    if (vLeft <= 0) document.getElementById("card-vacation").classList.add("disabled");
  }
}

function hasCompletedOneYear(startDate) {
  if (!startDate) return false;
  const start = new Date(startDate);
  const now   = new Date();
  const oneYearLater = new Date(start);
  oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);
  return now >= oneYearLater;
}

function goLeave(type) {
  const url = `${LEAVE_LIFF}?type=${encodeURIComponent(type)}`;
  liff.openWindow({ url, external: false });
}

init();
</script>
</body>
</html>
