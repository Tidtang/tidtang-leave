<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TIDTANG — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Anuphan',sans-serif;
  background:#eae7e4;
  min-height:100vh;
  padding:0 0 48px;
}

/* Loading */
.loading{
  position:fixed;inset:0;background:#eae7e4;
  display:flex;align-items:center;justify-content:center;z-index:100;
}
.spin{
  width:24px;height:24px;
  border:1.5px solid #ccc;border-top-color:#555;
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── PERSONAL CARD ─────────────────────────────────────── */
.card-personal{
  background:#191919;
  margin:20px 20px 0;
  border-radius:16px;
  padding:32px 28px 28px;
  color:#eae7e4;
  position:relative;
  overflow:hidden;
}

.company-logo{
  position:absolute;
  top:24px;
  right:24px;
  width:58px;
  height:auto;
  opacity:.94;
  display:block;
}

.tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(235,231,228,.4);margin-bottom:28px;
}

.emp-pos-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.08em;
  color:rgba(235,231,228,.5);margin-bottom:6px;
}
.emp-name{
  font-size:26px;font-weight:700;
  line-height:1.15;letter-spacing:-.3px;
  color:#eae7e4;margin-bottom:2px;
}
.emp-pos{
  font-size:12px;color:rgba(235,231,228,.55);
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.04em;margin-bottom:32px;
}

/* Contact lines */
.contact-block{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.contact-line{display:flex;align-items:baseline;gap:10px}
.contact-key{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;
  color:rgba(235,231,228,.35);width:36px;flex-shrink:0;
}
.contact-val{
  font-size:13px;color:rgba(235,231,228,.85);
  text-decoration:none;
}
.contact-val:active{opacity:.6}

/* Divider */
.card-divider{height:1px;background:rgba(235,231,228,.1);margin:0 0 24px}

/* QR LINE */
.qr-block{display:flex;align-items:center;gap:20px}
.qr-box{background:#fff;border-radius:8px;padding:8px;flex-shrink:0}
.qr-box canvas,.qr-box img{display:block}
.qr-info{}
.qr-label{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;
  color:rgba(235,231,228,.35);margin-bottom:4px;
}
.qr-sub{font-size:11px;color:rgba(235,231,228,.5);line-height:1.5}
.qr-placeholder{
  width:80px;height:80px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:#999;background:#f4f4f4;text-align:center;line-height:1.4;
}
.line-open{
  display:none;margin-top:8px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;
  color:#eae7e4;text-decoration:none;
  border-bottom:1px solid rgba(235,231,228,.3);
}

/* ── COMPANY CARD ──────────────────────────────────────── */
.card-company{
  background:#fff;
  margin:12px 20px 0;
  border-radius:16px;
  padding:28px;
  color:#2a2a2a;
}

.co-name-th{font-size:15px;font-weight:700;color:#191919;margin-bottom:2px}
.co-name-en{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.1em;color:#999;margin-bottom:24px;
}

.co-block{display:flex;flex-direction:column;gap:14px}
.co-row{display:flex;gap:12px}
.co-key{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;
  color:#bbb;width:36px;flex-shrink:0;padding-top:1px;
}
.co-val{font-size:13px;color:#333;line-height:1.55}
.co-val a{color:#191919;text-decoration:none;border-bottom:1px solid #e0e0e0}
.co-val a:active{opacity:.6}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="spin"></div></div>

<div id="app" style="display:none">

  <!-- Personal Card -->
  <div class="card-personal">
    <img src="logo-white.png" alt="TIDTANG Studio" class="company-logo">
    <div class="tag">TIDTANG STUDIO · PERSONAL</div>

    <div class="emp-pos-label" id="emp-dept-label">—</div>
    <div class="emp-name" id="emp-name">—</div>
    <div class="emp-pos" id="emp-pos">—</div>

    <div class="contact-block">
      <div class="contact-line" id="email-line">
        <span class="contact-key">Mail</span>
        <a class="contact-val" id="emp-email" href="#">—</a>
      </div>
      <div class="contact-line" id="phone-line" style="display:none">
        <span class="contact-key">Tel</span>
        <a class="contact-val" id="emp-phone" href="#">—</a>
      </div>
    </div>

    <div class="card-divider"></div>

    <div class="qr-block" id="line-qr-block">
      <div class="qr-box" id="line-qr"></div>
      <div class="qr-info">
        <div class="qr-label">Add LINE</div>
        <div class="qr-sub" id="line-qr-sub">Scan QR เพื่อ<br>เพิ่มเพื่อนใน LINE</div>
        <a class="line-open" id="line-open" href="#" target="_blank">Open LINE</a>
      </div>
    </div>
  </div>

  <!-- Company Card -->
  <div class="card-company">
    <div class="co-name-th">บริษัท ทิศทางสตูดิโอ จำกัด</div>
    <div class="co-name-en">TIDTANG STUDIO COMPANY LIMITED</div>

    <div class="co-block">
      <div class="co-row">
        <span class="co-key">ADR</span>
        <span class="co-val">511 ซอยศรีอยุธยา 6 ถนนพญาไท<br>ราชเทวี กรุงเทพฯ 10400</span>
      </div>
      <div class="co-row">
        <span class="co-key">TEL</span>
        <span class="co-val"><a href="tel:022464664">02 246 4664</a></span>
      </div>
      <div class="co-row">
        <span class="co-key">TAX</span>
        <span class="co-val">0105555095600</span>
      </div>
      <div class="co-row">
        <span class="co-key">WEB</span>
        <span class="co-val"><a href="https://www.tidtangstudio.com" target="_blank">tidtangstudio.com</a></span>
      </div>
    </div>
  </div>

</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwx-5qK1LrU7RjkaleQVYQ5GVCCe9Ab3_uoC7zE9gtj_0dKoXf86PyiHOhFmBVeN3Zm4g/exec";
const LIFF_ID    = "2010134572-FYjmDiXI";

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const p = await liff.getProfile();

    const res  = await fetch(`${WEBAPP_URL}?action=getProfile&userId=${encodeURIComponent(p.userId)}`);
    const data = await res.json();

    if (!data.success) {
      document.getElementById("loading").innerHTML =
        `<div style="font-size:13px;color:#666;padding:20px;text-align:center">${data.msg || "ไม่พบข้อมูลค่ะ"}</div>`;
      return;
    }

    render(data.emp);
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "";
  } catch(err) {
    document.getElementById("loading").innerHTML =
      `<div style="font-size:12px;color:#999;padding:20px;text-align:center">${err.message}</div>`;
  }
}

function render(e) {
  // Personal
  document.getElementById("emp-dept-label").textContent = e.dept || "";
  document.getElementById("emp-name").textContent = e.name || "—";
  document.getElementById("emp-pos").textContent  = e.pos  || "";

  if (e.email) {
    document.getElementById("emp-email").textContent = e.email;
    document.getElementById("emp-email").href = `mailto:${e.email}`;
  }

  if (e.phone) {
    const el = document.getElementById("phone-line");
    el.style.display = "flex";
    document.getElementById("emp-phone").textContent = e.phone;
    document.getElementById("emp-phone").href = `tel:${e.phone.replace(/[^0-9+]/g,"")}`;
  }

  renderLineQr(e);
}

function normalizeLineAddUrl(e) {
  // LINE User ID จาก LIFF มักขึ้นต้นด้วย U... ใช้กับระบบเท่านั้น
  // ไม่สามารถนำไปสร้าง Add Friend QR ได้
  // สำหรับนามบัตร ให้ใช้ LINE ID จริง หรือ LINE add URL จาก Apps Script แทน
  const fromServer = (e.lineAddUrl || "").trim();
  if (fromServer) return fromServer;

  const publicId = (e.linePublicId || e.lineOfficialId || "").trim();
  if (!publicId) return "";

  if (/^https?:\/\//i.test(publicId) || /^line:\/\//i.test(publicId)) return publicId;
  return `https://line.me/ti/p/~${encodeURIComponent(publicId.replace(/^@|^~/, ""))}`;
}

function renderLineQr(e) {
  const qrEl   = document.getElementById("line-qr");
  const subEl  = document.getElementById("line-qr-sub");
  const openEl = document.getElementById("line-open");
  qrEl.innerHTML = "";

  const lineUrl = normalizeLineAddUrl(e);

  if (lineUrl) {
    new QRCode(qrEl, {
      text: lineUrl,
      width: 80, height: 80,
      colorDark: "#191919", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
    subEl.innerHTML = "Scan QR เพื่อ<br>เพิ่มเพื่อนใน LINE";
    openEl.href = lineUrl;
    openEl.style.display = "inline-block";
    return;
  }

  qrEl.innerHTML = `<div class="qr-placeholder">LINE ID<br>ยังไม่ระบุ</div>`;
  subEl.innerHTML = "กรุณาใส่ LINE ID จริง<br>ในคอลัมน์ M";
  openEl.style.display = "none";
}

init();
</script>
</body>
</html>
