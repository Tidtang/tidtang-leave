<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TIDTANG — ปฏิทินวันลา</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --deep:#191919;--dark:#242424;--mid:#2e2e2e;--border:#383838;
  --off:#EBE7E4;--cream:#C8B8A2;--muted:#666;
  --green:#4caf50;--red:#e03535;--amber:#e8a020;--blue:#3b82f6;
  --holiday:#5eead4;--r:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Anuphan',sans-serif;background:var(--deep);color:var(--off);min-height:100vh}

.loading{position:fixed;inset:0;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100}
.spin{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--cream);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:12px;color:var(--muted);letter-spacing:.1em}

.header{background:var(--dark);border-bottom:1px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:10}
.header-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);margin-bottom:2px}
.header-title{font-size:17px;font-weight:800}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:var(--dark);border-bottom:1px solid var(--border)}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Nav */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.cal-btn{background:var(--mid);border:1px solid var(--border);color:var(--off);border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-title{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;letter-spacing:.03em}

/* Grid */
.cal-wrap{padding:0 10px 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-hdr{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-align:center;padding:5px 2px;color:var(--muted)}
.cal-day{background:var(--mid);border-radius:6px;min-height:58px;padding:4px;cursor:pointer;transition:background .12s;border:1px solid transparent;position:relative;overflow:hidden}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default}
.cal-day.today{border-color:var(--cream)}
.cal-day.weekend .cal-dn{color:var(--muted)}
.cal-day.holiday{background:#1a2e2e}
.cal-day.has-leave{background:#22201c}
.cal-day:not(.empty):hover{background:var(--border)}
.cal-dn{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--off);margin-bottom:3px}
.cal-day.today .cal-dn{color:var(--cream);font-weight:700}
.cal-holiday-lbl{font-size:8px;color:var(--holiday);line-height:1.2;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px}
.cal-dot{width:6px;height:6px;border-radius:50%}
.cal-more{font-size:8px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:1px}

/* Day panel */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.overlay.show{display:block}
.panel{position:fixed;bottom:0;left:0;right:0;background:var(--dark);border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding:16px;max-height:65vh;overflow-y:auto;z-index:50;transform:translateY(100%);transition:transform .22s ease}
.panel.open{transform:translateY(0)}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel-title{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cream)}
.panel-close{background:var(--mid);border:1px solid var(--border);color:var(--muted);border-radius:6px;width:28px;height:28px;font-size:14px;cursor:pointer}
.panel-holiday{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(94,234,212,.08);border:1px solid rgba(94,234,212,.2);border-radius:8px;margin-bottom:8px}
.panel-holiday-dot{width:10px;height:10px;border-radius:50%;background:var(--holiday);flex-shrink:0}
.panel-holiday-name{font-size:13px;color:var(--holiday)}
.panel-leave{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--mid);border-radius:8px;margin-bottom:6px}
.panel-leave-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.panel-leave-name{font-size:13px;font-weight:600;margin-bottom:2px}
.panel-leave-sub{font-size:11px;color:var(--muted)}
.empty-day{color:var(--muted);font-size:13px;text-align:center;padding:20px 0}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spin"></div>
  <div class="load-txt" id="load-txt">กำลังโหลด...</div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <div class="header-tag">TIDTANG STUDIO · LEAVE CALENDAR</div>
    <div class="header-title">ปฏิทินวันลา</div>
  </div>

  <div class="legend" id="legend">
    <div class="leg"><div class="leg-dot" style="background:var(--holiday)"></div>วันหยุดออฟฟิศ</div>
    <div class="leg"><div class="leg-dot" style="background:var(--red)"></div>ลาป่วย</div>
    <div class="leg"><div class="leg-dot" style="background:var(--blue)"></div>ลาพักร้อน</div>
    <div class="leg"><div class="leg-dot" style="background:var(--amber)"></div>ลากิจ</div>
    <div class="leg"><div class="leg-dot" style="background:#ec4899"></div>ลาฉุกเฉิน</div>
  </div>

  <div class="cal-nav">
    <button class="cal-btn" onclick="navMonth(-1)">←</button>
    <div class="cal-title" id="cal-title"></div>
    <button class="cal-btn" onclick="navMonth(1)">→</button>
  </div>

  <div class="cal-wrap">
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-hdr">
    <div class="panel-title" id="panel-title"></div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div id="panel-body"></div>
</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwx-5qK1LrU7RjkaleQVYQ5GVCCe9Ab3_uoC7zE9gtj_0dKoXf86PyiHOhFmBVeN3Zm4g/exec";
const LIFF_ID    = "2010134572-wCYr1N6t";

const MONTHS_TH = ["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const LEAVE_COLORS = {
  "ลาป่วย":"#e03535","ลาพักร้อน":"#3b82f6","ลากิจ":"#e8a020",
  "ลาฉุกเฉินพิเศษ":"#ec4899","ลาเกินโควต้า":"#f97316","Leave Without Pay":"#6b7280",
  "On Site":"#5eead4",
};

let userId = null;
let calYear, calMonth;
let dayMap   = {}; // key = "yyyy-MM-dd" → { leaves:[], holiday:null }

function bangkokNow() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Bangkok" }));
}

// ── Init ─────────────────────────────────────────────────────
async function init() {
  const now = bangkokNow();
  calYear  = now.getFullYear();
  calMonth = now.getMonth() + 1;
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const p = await liff.getProfile();
    userId  = p.userId;
    document.getElementById("load-txt").textContent = "โหลดปฏิทิน...";
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "";
    await loadMonth();
  } catch(err) {
    document.getElementById("load-txt").textContent = "เกิดข้อผิดพลาด: " + err.message;
  }
}

// ── Load month data ───────────────────────────────────────────
async function loadMonth() {
  updateTitle();
  document.getElementById("cal-grid").innerHTML =
    `<div style="color:var(--muted);font-size:12px;grid-column:span 7;padding:20px 0;text-align:center">กำลังโหลด...</div>`;

  const pad = n => String(n).padStart(2,"0");
  const lastDay = new Date(calYear, calMonth, 0).getDate();
  const from = `${calYear}-${pad(calMonth)}-01`;
  const to   = `${calYear}-${pad(calMonth)}-${lastDay}`;

  try {
    const res  = await fetch(`${WEBAPP_URL}?action=getCalendarData&userId=${encodeURIComponent(userId)}&from=${from}&to=${to}`);
    const data = await res.json();
    if (!data.success) {
      document.getElementById("cal-grid").innerHTML =
        `<div style="color:var(--red);font-size:12px;grid-column:span 7;padding:16px;text-align:center">${data.msg}</div>`;
      return;
    }
    buildDayMap(data.leaves || [], data.holidays || []);
    renderGrid();
  } catch(err) {
    document.getElementById("cal-grid").innerHTML =
      `<div style="color:var(--red);font-size:12px;grid-column:span 7;padding:16px;text-align:center">${err.message}</div>`;
  }
}

// ── Build day map ─────────────────────────────────────────────
function buildDayMap(leaves, holidays) {
  dayMap = {};
  const pad = n => String(n).padStart(2,"0");

  holidays.forEach(h => {
    if (!dayMap[h.date]) dayMap[h.date] = { leaves: [], holiday: null };
    dayMap[h.date].holiday = h.name;
  });

  leaves.forEach(lv => {
    // วน loop วันจาก startISO ถึง endISO
    let cur = new Date(lv.startISO + "T00:00:00");
    const end = new Date(lv.endISO + "T00:00:00");
    while (cur <= end) {
      const mo = cur.getMonth() + 1;
      if (mo === calMonth) {
        const key = `${cur.getFullYear()}-${pad(mo)}-${pad(cur.getDate())}`;
        if (!dayMap[key]) dayMap[key] = { leaves: [], holiday: dayMap[key]?.holiday || null };
        dayMap[key].leaves.push(lv);
      }
      cur.setDate(cur.getDate() + 1);
    }
  });
}

// ── Render calendar grid ──────────────────────────────────────
function renderGrid() {
  const pad = n => String(n).padStart(2,"0");
  const now = bangkokNow();
  const todayKey = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
  const total    = new Date(calYear, calMonth, 0).getDate();
  const days     = ["อา","จ","อ","พ","พฤ","ศ","ส"];

  let html = days.map(d => `<div class="cal-hdr">${d}</div>`).join("");
  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= total; d++) {
    const dow = new Date(calYear, calMonth - 1, d).getDay();
    const key = `${calYear}-${pad(calMonth)}-${pad(d)}`;
    const info = dayMap[key] || { leaves: [], holiday: null };
    const isToday   = key === todayKey;
    const isWeekend = dow === 0 || dow === 6;
    const hasHoliday = !!info.holiday;
    const hasLeave   = info.leaves.length > 0;

    const dots = info.leaves.slice(0,5).map(lv =>
      `<div class="cal-dot" style="background:${LEAVE_COLORS[lv.type]||'#888'}"></div>`
    ).join("");
    const more = info.leaves.length > 5
      ? `<div class="cal-more">+${info.leaves.length-5}</div>` : "";

    const cls = [
      "cal-day",
      isToday   ? "today"     : "",
      isWeekend ? "weekend"   : "",
      hasHoliday? "holiday"   : "",
      hasLeave  ? "has-leave" : "",
    ].filter(Boolean).join(" ");

    const enc = encodeURIComponent(JSON.stringify({ key, info }));
    html += `<div class="${cls}" onclick="showDay('${enc}')">
      <div class="cal-dn">${d}</div>
      ${hasHoliday ? `<div class="cal-holiday-lbl">${info.holiday}</div>` : ""}
      <div class="cal-dots">${dots}</div>
      ${more}
    </div>`;
  }
  document.getElementById("cal-grid").innerHTML = html;
}

// ── Day panel ─────────────────────────────────────────────────
function showDay(enc) {
  const { key, info } = JSON.parse(decodeURIComponent(enc));
  if (!info.holiday && !info.leaves.length) return;

  const [y, m, d] = key.split("-");
  document.getElementById("panel-title").textContent =
    `${parseInt(d)} ${MONTHS_TH[parseInt(m)]} ${parseInt(y)+543}`;

  let html = "";
  if (info.holiday) {
    html += `<div class="panel-holiday">
      <div class="panel-holiday-dot"></div>
      <div class="panel-holiday-name">${info.holiday}</div>
    </div>`;
  }
  info.leaves.forEach(lv => {
    const color = LEAVE_COLORS[lv.type] || "#888";
    html += `<div class="panel-leave">
      <div class="panel-leave-dot" style="background:${color}"></div>
      <div>
        <div class="panel-leave-name">${lv.nick}</div>
        <div class="panel-leave-sub">${lv.type} · ${lv.days} วัน</div>
      </div>
    </div>`;
  });
  if (!html) html = `<div class="empty-day">ไม่มีข้อมูลค่ะ</div>`;

  document.getElementById("panel-body").innerHTML = html;
  document.getElementById("panel").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}

function closePanel() {
  document.getElementById("panel").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

// ── Nav ───────────────────────────────────────────────────────
async function navMonth(dir) {
  calMonth += dir;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  if (calMonth < 1)  { calMonth = 12; calYear--; }
  await loadMonth();
}

function updateTitle() {
  document.getElementById("cal-title").textContent =
    `${MONTHS_TH[calMonth]} ${calYear + 543}`;
}

init();
</script>
</body>
</html>
