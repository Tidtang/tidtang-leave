<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TIDTANG — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --deep:#191919;--dark:#242424;--mid:#2e2e2e;--border:#383838;
  --off:#EBE7E4;--cream:#C8B8A2;--muted:#666;--white:#F5F2EE;
  --green:#4caf50;--red:#e03535;--amber:#e8a020;--blue:#3b82f6;
  --teal:#5eead4;--r:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Anuphan',sans-serif;background:var(--deep);color:var(--off);min-height:100vh}

/* Loading */
.loading{position:fixed;inset:0;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100}
.spin{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--cream);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:12px;color:var(--muted);letter-spacing:.1em}

/* Header */
.header{background:var(--dark);border-bottom:1px solid var(--border);padding:16px 20px;position:sticky;top:0;z-index:10}
.header-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);margin-bottom:2px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:18px;font-weight:800;letter-spacing:-.5px}
.header-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}

/* Tab */
.tabs{display:flex;background:var(--dark);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:12px 16px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em}
.tab.active{color:var(--cream);border-bottom-color:var(--cream)}

/* Content */
.content{padding:16px;display:none}
.content.active{display:block}

/* Section */
.sec-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--dark);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.stat-num{font-size:28px;font-weight:800;letter-spacing:-1px}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.stat-card.green .stat-num{color:var(--green)}
.stat-card.red .stat-num{color:var(--red)}
.stat-card.amber .stat-num{color:var(--amber)}
.stat-card.blue .stat-num{color:var(--blue)}

/* Person list */
.person-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.person-row{background:var(--dark);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.person-left{display:flex;align-items:center;gap:10px}
.person-av{width:32px;height:32px;border-radius:50%;background:var(--mid);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--cream);flex-shrink:0}
.person-name{font-size:14px;font-weight:600}
.person-sub{font-size:11px;color:var(--muted)}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em}
.badge-in{background:rgba(76,175,80,.15);color:var(--green);border:1px solid rgba(76,175,80,.3)}
.badge-leave{background:rgba(232,160,32,.15);color:var(--amber);border:1px solid rgba(232,160,32,.3)}
.badge-absent{background:rgba(224,53,53,.15);color:var(--red);border:1px solid rgba(224,53,53,.3)}
.badge-wfh{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}

/* Quota bar */
.quota-row{background:var(--dark);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.quota-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.quota-name{font-size:13px;font-weight:600}
.quota-nums{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.quota-bars{display:flex;flex-direction:column;gap:5px}
.quota-bar-row{display:flex;align-items:center;gap:8px}
.quota-bar-label{font-size:10px;color:var(--muted);width:48px;flex-shrink:0}
.quota-bar-track{flex:1;height:5px;background:var(--mid);border-radius:3px;overflow:hidden}
.quota-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.fill-sick{background:var(--amber)}
.fill-vac{background:var(--blue)}
.fill-per{background:var(--green)}
.quota-bar-val{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);width:28px;text-align:right}

/* Attendance table */
.att-table{width:100%;border-collapse:collapse;margin-bottom:16px}
.att-table th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 6px;text-align:left;border-bottom:1px solid var(--border)}
.att-table td{padding:10px 6px;font-size:12px;border-bottom:1px solid var(--border)}
.att-table tr:last-child td{border-bottom:none}
.att-time{font-family:'IBM Plex Mono',monospace;font-size:11px}
.att-hours{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cream)}
.att-noout{color:var(--red);font-size:10px}

/* Leave summary bars */
.leave-type-row{background:var(--dark);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.leave-type-head{display:flex;justify-content:space-between;margin-bottom:6px}
.leave-type-name{font-size:13px;font-weight:600}
.leave-type-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.leave-bar-track{height:4px;background:var(--mid);border-radius:2px;overflow:hidden}
.leave-bar-fill{height:100%;border-radius:2px}

/* Month selector */
.month-sel{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.month-btn{padding:6px 14px;background:var(--mid);border:1px solid var(--border);border-radius:6px;color:var(--off);font-family:'Anuphan',sans-serif;font-size:13px;cursor:pointer}
.month-btn.active{background:var(--cream);color:var(--deep);font-weight:700;border-color:var(--cream)}

/* Error / empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.err-box{background:rgba(224,53,53,.1);border:1px solid var(--red);border-radius:8px;padding:12px;margin-bottom:12px;font-size:12px;color:#fca5a5}

/* Refresh btn */
.btn-refresh{padding:8px 16px;background:var(--mid);border:1px solid var(--border);border-radius:8px;color:var(--off);font-family:'Anuphan',sans-serif;font-size:12px;cursor:pointer}

/* Search */
.search-box{width:100%;background:var(--mid);border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--off);font-family:'Anuphan',sans-serif;font-size:14px;margin-bottom:12px}
.search-box:focus{outline:none;border-color:var(--cream)}
.search-box::placeholder{color:var(--muted)}

/* Employee detail modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end}
.modal-sheet{background:var(--dark);border-radius:16px 16px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:20px}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-name{font-size:20px;font-weight:800;margin-bottom:2px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.modal-sec{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cream)}
.btn-modal-close{width:100%;padding:14px;background:var(--mid);border:1px solid var(--border);border-radius:var(--r);color:var(--off);font-family:'Anuphan',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spin"></div>
  <div class="load-txt" id="load-txt">กำลังโหลด...</div>
</div>

<div id="app" style="display:none">
  <!-- Header -->
  <div class="header">
    <div class="header-tag">TIDTANG STUDIO · HR DASHBOARD</div>
    <div class="header-row">
      <div class="header-title">Dashboard</div>
      <button class="btn-refresh" onclick="loadAll()">รีเฟรช</button>
    </div>
    <div class="header-date" id="header-date"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">วันนี้</div>
    <div class="tab" onclick="switchTab(1)">วันลา</div>
    <div class="tab" onclick="switchTab(2)">โควต้า</div>
    <div class="tab" onclick="switchTab(3)">Check In/Out</div>
  </div>

  <!-- Tab 0: วันนี้ -->
  <div class="content active" id="tab-0">
    <div class="sec-label">สถานะพนักงานวันนี้</div>
    <div class="stat-grid" id="today-stats"></div>
    <div class="sec-label">รายละเอียด</div>
    <div class="person-list" id="today-list"></div>
  </div>

  <!-- Tab 1: วันลา -->
  <div class="content" id="tab-1">
    <div class="month-sel" id="month-sel"></div>
    <div class="sec-label">สรุปตามประเภท</div>
    <div id="leave-type-list"></div>
    <div class="sec-label">รายละเอียดการลา</div>
    <input class="search-box" id="leave-search" placeholder="ค้นหาชื่อพนักงาน..." oninput="filterLeaveList()">
    <div class="person-list" id="leave-detail-list"></div>
  </div>

  <!-- Tab 2: โควต้า -->
  <div class="content" id="tab-2">
    <input class="search-box" id="quota-search" placeholder="ค้นหาชื่อพนักงาน..." oninput="filterQuotaList()">
    <div class="sec-label">โควต้าคงเหลือรายคน</div>
    <div id="quota-list"></div>
  </div>

  <!-- Tab 3: Check In/Out -->
  <div class="content" id="tab-3">
    <div class="month-sel" id="month-sel-att"></div>
    <input class="search-box" id="att-search" placeholder="ค้นหาชื่อพนักงาน..." oninput="filterAttTable()">
    <div class="sec-label">บันทึกเวลาเข้า-ออก</div>
    <table class="att-table" id="att-table">
      <thead>
        <tr>
          <th>ชื่อ</th>
          <th>วันที่</th>
          <th>เข้า</th>
          <th>ออก</th>
          <th>ชม.</th>
        </tr>
      </thead>
      <tbody id="att-body"></tbody>
    </table>
  </div>
</div>

<!-- Employee Detail Modal -->
<div class="modal-overlay" id="emp-modal" style="display:none" onclick="closeEmpModal(event)">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="modal-body"></div>
    <button class="btn-modal-close" onclick="closeEmpModal()">ปิด</button>
  </div>
</div>

<script>
const LIFF_ID    = "2010134572-zWuWoUGs";
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwx-5qK1LrU7RjkaleQVYQ5GVCCe9Ab3_uoC7zE9gtj_0dKoXf86PyiHOhFmBVeN3Zm4g/exec";

let userId   = null;
let viewer   = null;
let allData  = {};
let curMonth = new Date().getMonth() + 1;
let curYear  = new Date().getFullYear();

const MONTHS_TH = ["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const LEAVE_COLORS = {
  "ลาป่วย": "#e8a020", "ลาพักร้อน": "#3b82f6", "ลากิจ": "#4caf50",
  "WFH": "#a855f7", "On Site": "#ef4444", "ลาเกินโควต้า": "#ec4899",
  "Leave Without Pay": "#6b7280"
};

async function init() {
  try {
    setLoad("เชื่อมต่อ Line...");
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    setLoad("ตรวจสอบสิทธิ์...");
    const profile = await liff.getProfile();
    userId = profile.userId;

    const res  = await fetch(`${WEBAPP_URL}?action=getEmployee&userId=${encodeURIComponent(userId)}`);
    const data = await res.json();

    if (!data.success || !data.emp) {
      setLoad("ไม่พบข้อมูลในระบบค่ะ กรุณาลงทะเบียนก่อนนะคะ"); return;
    }

    viewer = data.emp;
    if (!["Full Access","HR","Admin"].includes(viewer.role)) {
      setLoad("ไม่มีสิทธิ์เข้าถึง Dashboard ค่ะ"); return;
    }

    hide("loading");
    showEl("app");

    // Header date
    const now = new Date();
    document.getElementById("header-date").textContent =
      `${now.getDate()} ${MONTHS_TH[now.getMonth()+1]} ${now.getFullYear()+543} · ${viewer.nick}`;

    // Month selectors
    renderMonthSel("month-sel", loadLeaveTab);
    renderMonthSel("month-sel-att", loadAttTab);

    await loadAll();

  } catch(err) {
    setLoad("เกิดข้อผิดพลาด: " + err.message);
    console.error(err);
  }
}

async function loadAll() {
  await loadTodayTab();
  await loadLeaveTab();
  await loadQuotaTab();
  await loadAttTab();
}

// ── Tab 0: วันนี้ ─────────────────────────────────────────────
async function loadTodayTab() {
  const statsEl = document.getElementById("today-stats");
  const listEl  = document.getElementById("today-list");
  statsEl.innerHTML = `<div style="color:var(--muted);font-size:12px">กำลังโหลด...</div>`;

  try {
    const now   = new Date();
    const from  = now.toISOString().split("T")[0];
    const to    = from;

    const [leaveRes, attRes] = await Promise.all([
      fetch(`${WEBAPP_URL}?action=getReport&userId=${encodeURIComponent(userId)}&from=${from}&to=${to}`),
      fetch(`${WEBAPP_URL}?action=getTodayAttendance&userId=${encodeURIComponent(userId)}`)
    ]);

    const leaveData = await leaveRes.json();
    const attData   = attRes.ok ? await attRes.json() : { success: false };

    // สรุปจาก leave
    const onLeave  = leaveData.success ? Object.keys(leaveData.byPerson || {}) : [];
    const checkedIn = attData.success  ? (attData.checkedIn || []) : [];

    statsEl.innerHTML = `
      <div class="stat-card green">
        <div class="stat-num">${checkedIn.length}</div>
        <div class="stat-label">Check In แล้ว</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-num">${onLeave.length}</div>
        <div class="stat-label">ลาวันนี้</div>
      </div>`;

    // รายละเอียด
    let html = "";

    if (checkedIn.length > 0) {
      html += `<div class="sec-label" style="margin-top:4px">มาทำงาน</div>`;
      checkedIn.forEach(p => {
        html += `<div class="person-row">
          <div class="person-left">
            <div class="person-av">${(p.nick||"?").substring(0,2)}</div>
            <div>
              <div class="person-name">${p.nick}</div>
              <div class="person-sub att-time">${p.timeIn || "—"} น.</div>
            </div>
          </div>
          <span class="badge badge-in">IN</span>
        </div>`;
      });
    }

    if (onLeave.length > 0) {
      html += `<div class="sec-label" style="margin-top:12px">ลาวันนี้</div>`;
      onLeave.forEach(nick => {
        const p = leaveData.byPerson[nick];
        const req = p.requests[0] || {};
        const badgeClass = req.type === "WFH" ? "badge-wfh" : "badge-leave";
        html += `<div class="person-row">
          <div class="person-left">
            <div class="person-av">${nick.substring(0,2)}</div>
            <div>
              <div class="person-name">${nick}</div>
              <div class="person-sub">${req.type || "ลา"}</div>
            </div>
          </div>
          <span class="badge ${badgeClass}">${req.type || "ลา"}</span>
        </div>`;
      });
    }

    if (!html) html = `<div class="empty">ไม่มีข้อมูลวันนี้ค่ะ</div>`;
    listEl.innerHTML = html;

  } catch(err) {
    statsEl.innerHTML = `<div class="err-box">โหลดข้อมูลไม่ได้: ${err.message}</div>`;
  }
}

// ── Tab 1: วันลา ─────────────────────────────────────────────
async function loadLeaveTab() {
  const typeEl   = document.getElementById("leave-type-list");
  const detailEl = document.getElementById("leave-detail-list");
  typeEl.innerHTML = `<div style="color:var(--muted);font-size:12px;margin-bottom:12px">กำลังโหลด...</div>`;

  try {
    const from = `${curYear}-${String(curMonth).padStart(2,"0")}-01`;
    const lastDay = new Date(curYear, curMonth, 0).getDate();
    const to   = `${curYear}-${String(curMonth).padStart(2,"0")}-${lastDay}`;

    const res  = await fetch(`${WEBAPP_URL}?action=getReport&userId=${encodeURIComponent(userId)}&from=${from}&to=${to}`);
    const data = await res.json();

    if (!data.success) { typeEl.innerHTML = `<div class="err-box">${data.msg}</div>`; return; }
    allLeaveData = data.byPerson || {};

    // Type summary
    const maxDays = Math.max(...Object.values(data.byType||{}).map(t => t.days), 1);
    let typeHtml = "";
    Object.entries(data.byType||{}).forEach(([type, info]) => {
      if (!info.count) return;
      const pct = Math.round((info.days / maxDays) * 100);
      const color = LEAVE_COLORS[type] || "#888";
      typeHtml += `<div class="leave-type-row">
        <div class="leave-type-head">
          <span class="leave-type-name">${type}</span>
          <span class="leave-type-count">${info.count} ครั้ง · ${info.days} วัน</span>
        </div>
        <div class="leave-bar-track">
          <div class="leave-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      </div>`;
    });
    typeEl.innerHTML = typeHtml || `<div class="empty">ไม่มีข้อมูลเดือนนี้ค่ะ</div>`;

    // Detail
    let detailHtml = "";
    Object.entries(data.byPerson||{}).forEach(([nick, p]) => {
      p.requests.forEach(req => {
        const color = LEAVE_COLORS[req.type] || "#888";
        detailHtml += `<div class="person-row" onclick="openEmpDetail('${nick}')" style="cursor:pointer">
          <div class="person-left">
            <div class="person-av" style="background:${color}22;color:${color}">${nick.substring(0,2)}</div>
            <div>
              <div class="person-name">${nick}</div>
              <div class="person-sub">${req.dateRange} · ${req.days} วัน</div>
            </div>
          </div>
          <span class="badge" style="background:${color}22;color:${color};border-color:${color}44">${req.type}</span>
        </div>`;
      });
    });
    detailEl.innerHTML = detailHtml || `<div class="empty">ไม่มีข้อมูลค่ะ</div>`;

  } catch(err) {
    typeEl.innerHTML = `<div class="err-box">${err.message}</div>`;
  }
}

// ── Tab 2: โควต้า ─────────────────────────────────────────────
async function loadQuotaTab() {
  const el = document.getElementById("quota-list");
  el.innerHTML = `<div style="color:var(--muted);font-size:12px">กำลังโหลด...</div>`;

  try {
    const res  = await fetch(`${WEBAPP_URL}?action=getAllQuota&userId=${encodeURIComponent(userId)}`);
    const data = await res.json();

    if (!data.success) { el.innerHTML = `<div class="err-box">${data.msg}</div>`; return; }

    let html = "";
    allQuotaData = data.quotas || [];
    (data.quotas || []).forEach(q => {
      const sickPct = q.sickTotal > 0 ? Math.round((q.sickLeft/q.sickTotal)*100) : 0;
      const vacPct  = q.vacationTotal > 0 ? Math.round((q.vacationLeft/q.vacationTotal)*100) : 0;
      const perPct  = q.personalTotal > 0 ? Math.round((q.personalLeft/q.personalTotal)*100) : 0;

      html += `<div class="quota-row" onclick="openEmpDetail('${q.nick}')" style="cursor:pointer">
        <div class="quota-head">
          <span class="quota-name">${q.nick}</span>
          <span class="quota-nums">${q.dept || ""}</span>
        </div>
        <div class="quota-bars">
          <div class="quota-bar-row">
            <span class="quota-bar-label">ป่วย</span>
            <div class="quota-bar-track"><div class="quota-bar-fill fill-sick" style="width:${sickPct}%"></div></div>
            <span class="quota-bar-val">${q.sickLeft}/${q.sickTotal}</span>
          </div>
          <div class="quota-bar-row">
            <span class="quota-bar-label">พักร้อน</span>
            <div class="quota-bar-track"><div class="quota-bar-fill fill-vac" style="width:${vacPct}%"></div></div>
            <span class="quota-bar-val">${q.vacationLeft}/${q.vacationTotal}</span>
          </div>
          <div class="quota-bar-row">
            <span class="quota-bar-label">กิจ</span>
            <div class="quota-bar-track"><div class="quota-bar-fill fill-per" style="width:${perPct}%"></div></div>
            <span class="quota-bar-val">${q.personalLeft}/${q.personalTotal}</span>
          </div>
        </div>
      </div>`;
    });

    el.innerHTML = html || `<div class="empty">ไม่มีข้อมูลค่ะ</div>`;

  } catch(err) {
    el.innerHTML = `<div class="err-box">${err.message}</div>`;
  }
}

// ── Tab 3: Check In/Out ───────────────────────────────────────
async function loadAttTab() {
  const tbody = document.getElementById("att-body");
  tbody.innerHTML = `<tr><td colspan="5" style="color:var(--muted);font-size:12px;padding:16px">กำลังโหลด...</td></tr>`;

  try {
    const res  = await fetch(`${WEBAPP_URL}?action=getAttendanceReport&userId=${encodeURIComponent(userId)}&month=${curMonth}&year=${curYear}`);
    const data = await res.json();

    if (!data.success) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="err-box">${data.msg}</div></td></tr>`;
      return;
    }

    allAttData = data.records || [];
    let html = "";
    (data.records || []).forEach(r => {
      const hoursClass = r.timeOut === "No Check-Out" ? "att-noout" : "att-hours";
      const hoursText  = r.timeOut === "No Check-Out" ? "ลืม Check Out" : (r.hours ? `${r.hours}h` : "—");
      html += `<tr onclick="openEmpDetail('${r.nick}')" style="cursor:pointer">
        <td><strong>${r.nick}</strong><br><span style="font-size:10px;color:var(--muted)">${r.dept||""}</span></td>
        <td class="att-time">${r.date}</td>
        <td class="att-time">${r.timeIn || "—"}</td>
        <td class="att-time ${r.timeOut === "No Check-Out" ? "att-noout" : ""}">${r.timeOut || "—"}</td>
        <td class="${hoursClass}">${hoursText}</td>
      </tr>`;
    });

    tbody.innerHTML = html || `<tr><td colspan="5" style="color:var(--muted);text-align:center;padding:20px">ไม่มีข้อมูลค่ะ</td></tr>`;

  } catch(err) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="err-box">${err.message}</div></td></tr>`;
  }
}

// ── Month selector ────────────────────────────────────────────
function renderMonthSel(elId, callback) {
  const el = document.getElementById(elId);
  let html = "";
  for (let m = 1; m <= 12; m++) {
    const active = m === curMonth ? "active" : "";
    html += `<button class="month-btn ${active}" onclick="selMonth(${m},'${elId}',${callback.name})">${MONTHS_TH[m]}</button>`;
  }
  el.innerHTML = html;
}

function selMonth(m, elId, fn) {
  curMonth = m;
  document.querySelectorAll(`#${elId} .month-btn`).forEach((b, i) => {
    b.classList.toggle("active", i + 1 === m);
  });
  fn();
}

// ── Tab switch ────────────────────────────────────────────────
function switchTab(idx) {
  document.querySelectorAll(".tab").forEach((t, i) => t.classList.toggle("active", i === idx));
  document.querySelectorAll(".content").forEach((c, i) => c.classList.toggle("active", i === idx));
}

// ── Helpers ───────────────────────────────────────────────────
function setLoad(txt) { document.getElementById("load-txt").textContent = txt; }
function hide(id)     { const el=document.getElementById(id); if(el) el.style.display="none"; }
function showEl(id)   { const el=document.getElementById(id); if(el) el.style.display="block"; }

// ── Employee Detail Modal ────────────────────────────────────
let allQuotaData = [];
let allLeaveData = {};
let allAttData   = [];

function openEmpDetail(nick) {
  const modal = document.getElementById("emp-modal");
  const nameEl = document.getElementById("modal-name");
  const subEl  = document.getElementById("modal-sub");
  const body   = document.getElementById("modal-body");

  nameEl.textContent = nick;

  // หา quota
  const q = allQuotaData.find(x => x.nick === nick);
  subEl.textContent = q ? `${q.dept || ""}` : "";

  let html = "";

  // โควต้า
  if (q) {
    html += `<div class="modal-sec">โควต้าวันลา</div>`;
    html += `<div class="detail-row"><span>ลาป่วย</span><span class="detail-val">${q.sickLeft}/${q.sickTotal}</span></div>`;
    html += `<div class="detail-row"><span>ลาพักร้อน</span><span class="detail-val">${q.vacationLeft}/${q.vacationTotal}</span></div>`;
    html += `<div class="detail-row"><span>ลากิจ</span><span class="detail-val">${q.personalLeft}/${q.personalTotal}</span></div>`;
    html += `<div class="detail-row"><span>WFH</span><span class="detail-val">${q.wfhCount} ครั้ง</span></div>`;
  }

  // ประวัติการลา
  const leaveReqs = allLeaveData[nick]?.requests || [];
  if (leaveReqs.length > 0) {
    html += `<div class="modal-sec">ประวัติการลาเดือนนี้</div>`;
    leaveReqs.forEach(r => {
      const color = {"ลาป่วย":"#e8a020","ลาพักร้อน":"#3b82f6","ลากิจ":"#4caf50","WFH":"#a855f7"}[r.type] || "#888";
      html += `<div class="detail-row">
        <span style="color:${color};font-weight:600">${r.type}</span>
        <span class="detail-val">${r.dateRange} · ${r.days}วัน</span>
      </div>`;
    });
  }

  // Check In/Out
  const attRecs = allAttData.filter(r => r.nick === nick).slice(-10);
  if (attRecs.length > 0) {
    html += `<div class="modal-sec">Check In/Out ล่าสุด</div>`;
    attRecs.reverse().forEach(r => {
      const outColor = r.timeOut === "No Out" ? "color:var(--red)" : "";
      html += `<div class="detail-row">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px">${r.date}</span>
        <span class="detail-val" style="${outColor}">${r.timeIn||"—"} → ${r.timeOut||"—"}</span>
      </div>`;
    });
  }

  body.innerHTML = html || `<div class="empty">ไม่มีข้อมูลค่ะ</div>`;
  modal.style.display = "flex";
}

function closeEmpModal(e) {
  if (!e || e.target === document.getElementById("emp-modal")) {
    document.getElementById("emp-modal").style.display = "none";
  }
}

// ── Search/Filter ─────────────────────────────────────────────
function filterLeaveList() {
  const q = (document.getElementById("leave-search")?.value || "").toLowerCase();
  document.querySelectorAll("#leave-detail-list .person-row").forEach(el => {
    const name = el.querySelector(".person-name")?.textContent.toLowerCase() || "";
    el.style.display = (!q || name.includes(q)) ? "" : "none";
  });
}

function filterQuotaList() {
  const q = (document.getElementById("quota-search")?.value || "").toLowerCase();
  document.querySelectorAll("#quota-list .quota-row").forEach(el => {
    const name = el.querySelector(".quota-name")?.textContent.toLowerCase() || "";
    el.style.display = (!q || name.includes(q)) ? "" : "none";
  });
}

function filterAttTable() {
  const q = (document.getElementById("att-search")?.value || "").toLowerCase();
  document.querySelectorAll("#att-body tr").forEach(el => {
    const name = el.querySelector("td strong")?.textContent.toLowerCase() || "";
    el.style.display = (!q || name.includes(q)) ? "" : "none";
  });
}

  function waitLiff(cb) {

    else setTimeout(() => waitLiff(cb), 100);
  }
  waitLiff(init);
