<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<!-- TIDTANG_V81_FORGOT_CHECKOUT_EVIDENCE_2026-07-22 -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TIDTANG — Check In / Out</title>
<!-- v63: On Site checkout GPS radius + separate Check In/Out location support -->
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --deep:#191919;--dark:#242424;--mid:#2e2e2e;--border:#383838;
  --off:#EBE7E4;--cream:#C8B8A2;--muted:#666;
  --green:#4caf50;--red:#e03535;--amber:#e8a020;--blue:#3b82f6;--r:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Anuphan',sans-serif;background:var(--deep);color:var(--off);min-height:100vh}

.loading{position:fixed;inset:0;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100}
.spin{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--cream);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:12px;color:var(--muted);letter-spacing:.1em}

.header{background:var(--dark);border-bottom:1px solid var(--border);padding:16px 20px}
.header-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);margin-bottom:2px}
.header-title{font-size:20px;font-weight:800}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px}

.user-chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:8px;padding:10px 14px;margin:12px 20px 0}
.av{width:32px;height:32px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--deep);flex-shrink:0}
.u-name{font-size:13px;font-weight:700}
.u-role{font-size:10px;color:var(--muted)}

.body{padding:20px;display:flex;flex-direction:column;gap:14px}
.sec-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* Active card */
.active-card{border-radius:var(--r);padding:16px;border:1.5px solid var(--green);background:rgba(76,175,80,.08);margin-bottom:4px}
.active-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.active-time{font-size:22px;font-weight:800;letter-spacing:-1px}
.active-sub{font-size:12px;color:var(--muted);margin-top:2px}
.active-method{font-size:10px;color:var(--cream);margin-top:6px;font-family:'IBM Plex Mono',monospace}

/* Buttons */
.btn{width:100%;padding:16px;border:none;border-radius:var(--r);font-family:'Anuphan',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-checkin{background:var(--cream);color:var(--deep)}
.btn-checkout{background:#434343;color:var(--off)}
.btn-emergency{background:transparent;border:1.5px solid var(--border);color:var(--off);font-size:14px;padding:13px}
.btn-contact{background:transparent;border:1.5px solid var(--border);color:var(--off);font-size:14px;padding:13px}
.btn-retry{background:var(--mid);border:1.5px solid var(--border);color:var(--off);font-size:14px;padding:13px}
.btn-late{background:var(--mid);border:1.5px solid var(--border);color:var(--off);font-size:15px}

/* Password screen */
.pwd-card{background:var(--dark);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.pwd-title{font-size:15px;font-weight:700;margin-bottom:6px}
.pwd-sub{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.inp{width:100%;background:var(--mid);border:1.5px solid var(--border);border-radius:8px;padding:14px;color:var(--off);font-family:'Anuphan',sans-serif;font-size:16px}
.inp:focus{outline:none;border-color:var(--cream)}
.inp.err{border-color:var(--red)}
.remember-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.remember-row input{width:18px;height:18px;cursor:pointer}

/* Emergency screen */
.emergency-card{background:var(--dark);border:1.5px solid var(--amber);border-radius:var(--r);padding:16px;margin-bottom:14px}
.emergency-title{font-size:14px;font-weight:700;color:var(--amber);margin-bottom:4px}
.emergency-sub{font-size:12px;color:var(--muted);line-height:1.6}
.reason-grid{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.reason-btn{padding:12px;background:var(--mid);border:1.5px solid var(--border);border-radius:8px;color:var(--off);font-family:'Anuphan',sans-serif;font-size:13px;cursor:pointer;text-align:left}
.reason-btn.selected{border-color:var(--amber);background:rgba(232,160,32,.1);color:var(--amber)}

/* Status */
.status-card{background:var(--dark);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.status-icon{font-size:36px;margin-bottom:8px}
.status-title{font-size:18px;font-weight:800;margin-bottom:6px}
.status-sub{font-size:13px;color:var(--muted);line-height:1.7}

/* Alert */
.alert{border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:12px;line-height:1.6}
.alert-err{background:rgba(224,53,53,.12);border:1px solid var(--red);color:#fca5a5}
.alert-ok{background:rgba(76,175,80,.12);border:1px solid var(--green);color:#86efac}
.alert-warn{background:rgba(232,160,32,.12);border:1px solid var(--amber);color:#fcd34d}

.divider{height:1px;background:var(--border);margin:4px 0}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spin"></div>
  <div class="load-txt" id="load-txt">กำลังโหลด...</div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <div class="header-tag">TIDTANG STUDIO</div>
    <div class="header-title">Check In / Out</div>
    <div class="header-sub" id="hdr-date"></div>
  </div>
  <div class="user-chip">
    <div class="av" id="av"></div>
    <div>
      <div class="u-name" id="u-name">—</div>
      <div class="u-role" id="u-role">—</div>
    </div>
  </div>
  <div class="body" id="body"></div>
</div>

<script>
const LIFF_ID    = "2010134572-hkPA2Wuf";
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwx-5qK1LrU7RjkaleQVYQ5GVCCe9Ab3_uoC7zE9gtj_0dKoXf86PyiHOhFmBVeN3Zm4g/exec";
const WIFI_PWD_KEY = "tidtang_wifi_pwd";
const OFFICE_SUBNETS = ["192.168.11.", "192.168.14."];

let userId = null, emp = null, activeCheckin = null;

function bangkokNow() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Bangkok" }));
}

// ── Init ────────────────────────────────────────────────────────
async function init() {
  try {
    setLoad("เชื่อมต่อ Line...");
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    setLoad("ดึงข้อมูล...");
    const profile = await liff.getProfile();
    userId = profile.userId;

    const res  = await fetch(`${WEBAPP_URL}?action=getAttendanceStatus&userId=${encodeURIComponent(userId)}`);
    const data = await res.json();

    if (!data.success || !data.emp) {
      setLoad("ไม่พบข้อมูลในระบบค่ะ กรุณาลงทะเบียนก่อนนะคะ"); return;
    }

    emp = data.emp;
    activeCheckin = data.activeCheckin;

    hide("loading");
    document.getElementById("app").style.display = "block";

    // Header
    const now = bangkokNow();
    document.getElementById("hdr-date").textContent =
      `${now.toLocaleDateString("th-TH", {weekday:"long",day:"numeric",month:"long",year:"numeric"})}`;
    document.getElementById("av").textContent = (emp.nick||"?").substring(0,2).toUpperCase();
    document.getElementById("u-name").textContent = emp.nick || "—";
    document.getElementById("u-role").textContent = `${emp.pos || ""} · ${emp.dept || ""}`;

    renderMain();
  } catch(err) {
    setLoad("เกิดข้อผิดพลาด: " + err.message);
  }
}

// ── Main screen ─────────────────────────────────────────────────
function renderMain() {
  const body = document.getElementById("body");
  const now  = bangkokNow();
  const timeStr = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});

  if (activeCheckin) {
    // มี Check In อยู่ → แสดง Check Out
    const isOnSite = activeCheckin.mode === "onsite";
    body.innerHTML = `
      <div>
        <div class="sec-label">สถานะปัจจุบัน</div>
        <div class="active-card">
          <div class="active-badge">กำลังทำงาน</div>
          <div class="active-time">${activeCheckin.timeIn || "—"} น.</div>
          <div class="active-sub">Check In แล้ว · ${isOnSite ? "On Site" : "Office"}</div>
          <div class="active-method">Method: ${activeCheckin.method || "WiFi Verified"}</div>
        </div>
      </div>
      <div class="sec-label">Check Out</div>
      ${isOnSite
        ? `<button class="btn btn-checkout" onclick="startCheckOutOnSite()">Check Out On Site</button>`
        : `<button class="btn btn-checkout" onclick="startCheckOut()">Check Out ตอนนี้</button>
           <button class="btn btn-emergency" style="margin-top:8px" onclick="showEmergencyOut()">Emergency Check Out</button>
           <button class="btn btn-retry" style="margin-top:8px" onclick="forgotCheckOut()">ลืม Check Out</button>`
      }
      <button class="btn btn-retry" style="margin-top:12px" onclick="showMyHistory()">ประวัติเวลาเข้า-ออกงาน</button>`;
  } else {
    // ยังไม่ได้ Check In
    body.innerHTML = `
      <div class="sec-label">Check In</div>
      <button class="btn btn-checkin" style="margin-bottom:10px" onclick="startCheckIn()">Check In Office</button>
      <button class="btn btn-late" onclick="startCheckInOnSite()">Check In On Site</button>
      <div class="divider" style="margin-top:10px"></div>
      <button class="btn btn-retry" style="margin-top:4px" onclick="showMyHistory()">ประวัติเวลาเข้า-ออกงาน</button>`;
  }
}

// ── CHECK IN FLOW ────────────────────────────────────────────────
async function startCheckIn() {
  await verifyAndCheckIn();
}

async function getPublicIP() {
  try {
    const res = await fetch("https://api.ipify.org?format=json");
    const data = await res.json();
    return data.ip || null;
  } catch(e) {
    return null;
  }
}

async function verifyAndCheckIn() {
  showLoading("กำลังตรวจสอบเครือข่าย WiFi...");

  try {
    const now = bangkokNow();
    const timeIn = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});

    const publicIp = await getPublicIP();
    if (!publicIp) {
      hide("loading");
      document.getElementById("app").style.display = "block";
      showWifiError();
      return;
    }

    const res = await fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({
        action: "attendanceCheckin",
        userId, mode: "office",
        publicIp,
        timeIn,
        method: "WiFi"
      })
    });
    const data = await res.json();

    hide("loading");
    document.getElementById("app").style.display = "block";

    if (data.success) {
      activeCheckin = { timeIn, mode: "office", method: "WiFi Verified" };
      showSuccess("checkin", timeIn);
    } else if (data.wrongWifi) {
      showWifiError();
    } else {
      renderMain();
      showAlertInBody("err", data.msg || "เกิดข้อผิดพลาดค่ะ");
    }
  } catch(err) {
    hide("loading");
    document.getElementById("app").style.display = "block";
    renderMain();
    showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
  }
}

function showWifiError() {
  const body = document.getElementById("body");
  body.innerHTML = `
    <div class="alert alert-warn">ไม่ได้เชื่อมต่อ WiFi ออฟฟิศค่ะ<br>กรุณาเชื่อมต่อ WiFi ออฟฟิศแล้วลองใหม่ หรือใช้ "Emergency Check In" หากเครือข่ายมีปัญหา</div>
    <button class="btn btn-retry" onclick="startCheckIn()">ลองอีกครั้ง</button>
    <button class="btn btn-emergency" style="margin-top:8px" onclick="showEmergencyIn()">Emergency Check In</button>`;
}

// ── EMERGENCY CHECK IN ───────────────────────────────────────────
function showEmergencyIn() {
  renderEmergencyScreen("checkin");
}

function showEmergencyOut() {
  renderEmergencyScreen("checkout");
}

let selectedReason = "";
let emergencyPhoto = null;
let emergencyGPS   = null;

function renderEmergencyScreen(mode) {
  selectedReason = "";
  emergencyPhoto = null;
  emergencyGPS   = null;

  const title = mode === "checkin" ? "Emergency Check In" : "Emergency Check Out";
  const body  = document.getElementById("body");

  body.innerHTML = `
    <div class="emergency-card">
      <div class="emergency-title">${title}</div>
      <div class="emergency-sub">ระบบไม่สามารถตรวจสอบเครือข่ายได้ กรุณาให้ข้อมูลเพิ่มเติมค่ะ</div>
    </div>

    <div class="sec-label">เหตุผล</div>
    <div class="reason-grid">
      ${["WiFi มีปัญหา","อินเทอร์เน็ตขัดข้อง","ระบบไม่สามารถตรวจสอบเครือข่ายได้","อื่นๆ"]
        .map(r => `<button class="reason-btn" onclick="selectReason(this,'${r}')">${r}</button>`).join("")}
    </div>

    <div class="sec-label">ถ่ายรูปปัจจุบัน</div>
    <div style="margin-bottom:14px">
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="onPhotoSelected(this)">
      <button class="btn btn-retry" onclick="document.getElementById('photo-input').click()">ถ่ายรูป (ต้องถ่ายใหม่เท่านั้น)</button>
      <div id="photo-preview" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>
    </div>

    <div id="alert-box"></div>
    <button class="btn btn-emergency" onclick="submitEmergency('${mode}')" id="btn-emergency-submit" disabled>
      ส่ง Emergency ${mode === "checkin" ? "Check In" : "Check Out"}
    </button>
    <button class="btn btn-retry" style="margin-top:8px" onclick="renderMain()">ยกเลิก</button>`;

  // ขอ GPS ทันที
  getGPS();
}

function selectReason(el, reason) {
  document.querySelectorAll(".reason-btn").forEach(b => b.classList.remove("selected"));
  el.classList.add("selected");
  selectedReason = reason;
  checkEmergencyReady();
}

function onPhotoSelected(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    // ตรวจว่าถ่ายใหม่ (ไม่ใช่จาก album) — capture=environment บังคับใช้กล้องแล้ว
    emergencyPhoto = file;
    document.getElementById("photo-preview").textContent = `รูปที่เลือก: ${file.name}`;
    checkEmergencyReady();
  }
}

function getGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => {
      emergencyGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      checkEmergencyReady();
    },
    err => { console.log("GPS error:", err); }
  );
}

function checkEmergencyReady() {
  const btn = document.getElementById("btn-emergency-submit");
  if (btn) btn.disabled = !(selectedReason && emergencyPhoto);
}

// ── Watermark timestamp + GPS ลงบนรูปจริง ──────────────────────
function watermarkPhoto(file, gps) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;

    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width  = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);

      const now = bangkokNow();
      const dateStr = `${now.getDate().toString().padStart(2,"0")}/${(now.getMonth()+1).toString().padStart(2,"0")}/${now.getFullYear()+543}`;
      const timeStr = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
      const gpsStr  = gps ? `GPS: ${gps.lat.toFixed(6)}, ${gps.lng.toFixed(6)}` : "GPS: ไม่พบตำแหน่ง";

      const fontSize = Math.max(24, Math.round(canvas.width * 0.038));
      const padding  = Math.round(fontSize * 0.7);
      const lineH    = Math.round(fontSize * 1.5);
      const boxH     = lineH * 3 + padding * 2;

      // พื้นหลังทึบด้านล่างรูป
      ctx.fillStyle = "rgba(0,0,0,0.72)";
      ctx.fillRect(0, canvas.height - boxH, canvas.width, boxH);

      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${fontSize}px monospace`;
      ctx.textBaseline = "top";

      // เพิ่ม shadow ให้ข้อความอ่านง่ายขึ้น
      ctx.shadowColor = "rgba(0,0,0,0.9)";
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 1;

      let y = canvas.height - boxH + padding;
      ctx.fillText(`TIDTANG STUDIO · Emergency`, padding, y);
      y += lineH;
      ctx.fillText(`${dateStr}  ${timeStr}`, padding, y);
      y += lineH;
      ctx.fillText(gpsStr, padding, y);

      canvas.toBlob((blob) => {
        resolve(blob);
      }, "image/jpeg", 0.85);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function submitEmergency(mode) {
  if (!selectedReason || !emergencyPhoto) return;

  const btn = document.getElementById("btn-emergency-submit");
  if (btn) { btn.disabled = true; btn.textContent = "กำลังประมวลผลรูป..."; }

  const now = bangkokNow();
  const timeStr = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});

  try {
    // ประทับ timestamp+GPS ลงรูปก่อนส่ง
    const watermarkedBlob = await watermarkPhoto(emergencyPhoto, emergencyGPS);

    const reader = new FileReader();
    reader.onload = async (e) => {
      const photoBase64 = e.target.result.split(",")[1];

      try {
        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify({
            action: mode === "checkin" ? "emergencyCheckin" : "emergencyCheckout",
            userId,
            time: timeStr,
            reason: selectedReason,
            lat: emergencyGPS?.lat || null,
            lng: emergencyGPS?.lng || null,
            photo: photoBase64,
            method: "Emergency"
          })
        });
        const data = await res.json();

        if (data.success) {
          if (mode === "checkin") {
            activeCheckin = { timeIn: timeStr, mode: "office", method: "Emergency" };
          } else {
            activeCheckin = null;
          }
          showEmergencySuccess(mode);
        } else if (data.outOfRange) {
          const body = document.getElementById("body");
          body.innerHTML = `
            <div class="alert alert-err" style="white-space:pre-line">${data.msg}</div>
            <button class="btn btn-retry" onclick="renderMain()">กลับหน้าหลัก</button>`;
        } else {
          showAlertInBody("err", data.msg || "เกิดข้อผิดพลาดค่ะ");
          if (btn) { btn.disabled = false; btn.textContent = `ส่ง Emergency ${mode === "checkin" ? "Check In" : "Check Out"}`; }
        }
      } catch(err) {
        showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
        if (btn) { btn.disabled = false; btn.textContent = `ส่ง Emergency ${mode === "checkin" ? "Check In" : "Check Out"}`; }
      }
    };
    reader.readAsDataURL(watermarkedBlob);
  } catch(err) {
    showAlertInBody("err", "เกิดข้อผิดพลาดในการประมวลผลรูป: " + err.message);
    if (btn) { btn.disabled = false; btn.textContent = `ส่ง Emergency ${mode === "checkin" ? "Check In" : "Check Out"}`; }
  }
}

// ── CHECK IN ON SITE ────────────────────────────────────────────
let onsiteGPS = null;
let onsiteProjectName = "";

function startCheckInOnSite() {
  const body = document.getElementById("body");
  onsiteGPS = null;

  body.innerHTML = `
    <div class="sec-label">Check In On Site</div>
    <div class="pwd-card">
      <div class="pwd-title">ชื่อโปรเจกต์ / สถานที่</div>
      <input class="inp" id="onsite-project" type="text" placeholder="เช่น บ้านคุณสมชาย, Site A" style="margin-bottom:10px">
      <div id="gps-status" class="alert alert-warn" style="display:none">กำลังดึง GPS...</div>
    </div>
    <div id="alert-box"></div>
    <button class="btn btn-checkin" id="btn-onsite-submit" onclick="submitCheckInOnSite()" disabled>Check In On Site</button>
    <button class="btn btn-retry" style="margin-top:8px" onclick="renderMain()">ยกเลิก</button>`;

  const statusEl = document.getElementById("gps-status");

  navigator.geolocation.getCurrentPosition(
    pos => {
      onsiteGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (statusEl) {
        statusEl.className = "alert alert-ok";
        statusEl.textContent = `GPS พร้อมแล้วค่ะ (${onsiteGPS.lat.toFixed(5)}, ${onsiteGPS.lng.toFixed(5)})`;
      }
      const btn = document.getElementById("btn-onsite-submit");
      if (btn) btn.disabled = false;
    },
    err => {
      if (statusEl) {
        statusEl.className = "alert alert-err";
        statusEl.textContent = "ดึง GPS ไม่ได้ค่ะ กรุณาเปิด Location แล้วลองใหม่";
      }
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

function getOnsiteDistanceFromCheckin() {
  if (!activeCheckin || !activeCheckin.lat || !activeCheckin.lng || !onsiteCheckoutGPS) return null;
  return getDistance(Number(activeCheckin.lat), Number(activeCheckin.lng), Number(onsiteCheckoutGPS.lat), Number(onsiteCheckoutGPS.lng));
}

function readOnsitePhotoBase64() {
  return new Promise((resolve, reject) => {
    if (!onsiteCheckoutPhoto) return reject(new Error("ยังไม่ได้ถ่ายรูปค่ะ"));
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result.split(",")[1]);
    reader.onerror = () => reject(new Error("อ่านไฟล์รูปไม่ได้ค่ะ"));
    reader.readAsDataURL(onsiteCheckoutPhoto);
  });
}

async function submitCheckOutOnSite(acceptAutoOut = false) {
  if (!onsiteCheckoutPhoto || !onsiteCheckoutGPS) return;

  const dist = getOnsiteDistanceFromCheckin();
  if (dist !== null && dist > 200 && !acceptAutoOut) {
    showOutOfRadiusOptions(dist);
    return;
  }

  const now     = bangkokNow();
  const timeOut = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});
  const hour    = now.getHours();

  try {
    const photoBase64 = await readOnsitePhotoBase64();
    showLoading(acceptAutoOut ? "กำลังบันทึก Auto Check Out..." : "กำลัง Check Out On Site...");

    const res = await fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({
        action: "attendanceCheckout",
        userId,
        timeOut,
        lat: onsiteCheckoutGPS.lat,
        lng: onsiteCheckoutGPS.lng,
        photo: photoBase64,
        checkoutMethod: acceptAutoOut ? "auto-onsite" : "On Site",
        acceptAutoOut: acceptAutoOut
      })
    });
    const data = await res.json();

    hide("loading");
    document.getElementById("app").style.display = "block";

    if (data.success) {
      activeCheckin = null;
      if (data.autoOut || acceptAutoOut) showSuccess("onsite-autoout", data.timeOut || timeOut, hour);
      else showSuccess("onsite-checkout", data.timeOut || timeOut, hour);
    } else if (data.outOfRadius) {
      showOutOfRadiusOptions(data.dist || dist || 0);
    } else {
      renderMain();
      showAlertInBody("err", data.msg || "เกิดข้อผิดพลาดค่ะ");
    }
  } catch(err) {
    hide("loading");
    document.getElementById("app").style.display = "block";
    renderMain();
    showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
  }
}

async function submitEmergencyCheckOutOnSite(distFromCheckin) {
  if (!onsiteCheckoutPhoto || !onsiteCheckoutGPS) return;
  const reason = prompt("กรุณาระบุเหตุผลสำหรับ Emergency Check Out เช่น เดินทางกลับจากไซต์ / เสร็จงานนอกพื้นที่ / GPS เพี้ยน");
  if (!reason || reason.trim().length < 3) return;

  const now     = bangkokNow();
  const timeOut = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});

  try {
    const photoBase64 = await readOnsitePhotoBase64();
    showLoading("กำลังส่ง Emergency Check Out...");

    const res = await fetch(WEBAPP_URL, {
      method: "POST",

        lng: onsiteCheckoutGPS.lng,

    hide("loading");

    } else {

    }

    renderMain();
    showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
  }
}

function getDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const p1 = lat1 * Math.PI / 180;
  const p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180;
  const dl = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dp/2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

          <div class="emergency-sub">Admin / HR ได้รับแจ้งแล้วค่ะ<br>รอการติดต่อกลับทาง LINE ได้เลยค่ะ</div>
        </div>

  }
}

function showAlertInBody(type, msg) {
  const existing = document.getElementById("body-alert");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.id = "body-alert";
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  document.getElementById("body").prepend(el);
}

function showAlert(type, msg) {
  const el = document.getElementById("alert-box");
  if (!el) return;
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  el.style.display = "block";
}

// ── ประวัติเวลาเข้า-ออกงาน ────────────────────────────────────────
const MONTHS_TH = ["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
let historyMonth = bangkokNow().getMonth() + 1;
let historyYear  = bangkokNow().getFullYear();
let historyData  = [];

function fmtTime(raw) {
  if (!raw) return "—";
  const s = String(raw);
  if (s.includes("1899") || (s.includes("T") && s.includes("-"))) {
    try { const d = new Date(s); if (!isNaN(d)) return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; } catch(e) {}
    return s.split("T")[1]?.substring(0,5) || "—";
  }
  if (s.match(/^\d{2}:\d{2}/)) return s.substring(0,5);
  return s || "—";
}

async function showMyHistory() {
  const body = document.getElementById("body");
  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <button onclick="renderMain()" style="background:var(--mid);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--off);font-size:13px;cursor:pointer">← กลับ</button>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">ประวัติเวลาเข้า-ออกงาน</div>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:4px" id="hist-month-sel"></div>
    <div id="hist-summary" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px"></div>
    <div id="hist-list"><div style="color:var(--muted);font-size:12px;text-align:center;padding:20px">กำลังโหลด...</div></div>`;

  renderHistMonthSel();
  await loadHistory();
}

function renderHistMonthSel() {
  const el = document.getElementById("hist-month-sel");
  if (!el) return;
  let html = "";
  for (let m = 1; m <= 12; m++) {
    const active = m === historyMonth;
    html += `<button onclick="selHistMonth(${m})"
      style="flex-shrink:0;padding:6px 12px;background:${active ? "var(--cream)" : "var(--mid)"};
      border:1px solid ${active ? "var(--cream)" : "var(--border)"};border-radius:6px;
      color:${active ? "var(--deep)" : "var(--off)"};font-size:12px;cursor:pointer;
      font-weight:${active ? "700" : "400"};white-space:nowrap">${MONTHS_TH[m]}</button>`;
  }
  el.innerHTML = html;
}

async function selHistMonth(m) {
  historyMonth = m;
  renderHistMonthSel();
  await loadHistory();
}

async function loadHistory() {
  const listEl = document.getElementById("hist-list");
  const sumEl  = document.getElementById("hist-summary");
  if (!listEl) return;
  listEl.innerHTML = `<div style="color:var(--muted);font-size:12px;text-align:center;padding:20px">กำลังโหลด...</div>`;

  try {
    const res  = await fetch(`${WEBAPP_URL}?action=getMyAttendance&userId=${encodeURIComponent(userId)}&month=${historyMonth}&year=${historyYear}`);
    const data = await res.json();
    if (!data.success) { listEl.innerHTML = `<div style="color:#fca5a5;font-size:12px;padding:12px">${data.msg}</div>`; return; }

    historyData = data.records || [];

    // Summary
    let totalDays = 0, totalHours = 0, noOutCount = 0;
    historyData.forEach(r => {
      if (r.timeIn && r.timeOut && r.timeOut !== "No Out" && r.timeOut !== "No In-Out") totalDays++;
      if (r.hours) totalHours += parseFloat(r.hours) || 0;
      if (!r.timeOut || r.timeOut === "No Out" || r.timeOut === "No In-Out") noOutCount++;
    });

    if (sumEl) sumEl.innerHTML = `
      <div style="background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:800;color:var(--cream)">${totalDays}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">วันที่มา</div>
      </div>
      <div style="background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:800;color:#4caf50">${totalHours.toFixed(1)}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">ชม.รวม</div>
      </div>
      <div style="background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:800;color:${noOutCount > 0 ? "#e03535" : "var(--muted)"}">${noOutCount}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">No Out</div>
      </div>`;

    if (!historyData.length) {
      listEl.innerHTML = `<div style="text-align:center;padding:32px;color:var(--muted);font-size:13px">ไม่มีข้อมูลเดือน ${MONTHS_TH[historyMonth]} ค่ะ</div>`;
      return;
    }

    // Table
    let html = `
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr>
            <th style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)">วันที่</th>
            <th style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)">เข้า</th>
            <th style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)">ออก</th>
            <th style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)">ชม.</th>
            <th style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)">Mode</th>
          </tr>
        </thead>
        <tbody>`;

    historyData.forEach(r => {
      const timeIn  = fmtTime(r.timeIn);
      const timeOut = fmtTime(r.timeOut);
      const isNoOut = !r.timeOut || r.timeOut === "No Out" || r.timeOut === "No In-Out";
      const isEmg   = String(r.mode||"").includes("Emergency") || String(r.note||"").includes("Emergency");
      const hours   = r.hours ? parseFloat(r.hours).toFixed(1) : "—";
      const modeLabel = isEmg ? "EMG" : (r.mode || "Office");
      const modeColor = isEmg ? "#e8a020" : (r.mode === "On Site" ? "#4caf50" : "var(--muted)");

      html += `<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:9px 4px;font-family:'IBM Plex Mono',monospace">${r.date||"—"}</td>
        <td style="padding:9px 4px;font-family:'IBM Plex Mono',monospace">${timeIn}</td>
        <td style="padding:9px 4px;font-family:'IBM Plex Mono',monospace;color:${isNoOut ? "#e03535" : "var(--off)"}">${isNoOut ? "No Out" : timeOut}</td>
        <td style="padding:9px 4px;font-family:'IBM Plex Mono',monospace">${hours}</td>
        <td style="padding:9px 4px;font-size:10px;color:${modeColor}">${modeLabel}</td>
      </tr>`;
    });

    html += `</tbody></table>`;
    listEl.innerHTML = html;

  } catch(err) {
    if (listEl) listEl.innerHTML = `<div style="color:#fca5a5;font-size:12px;padding:12px">เกิดข้อผิดพลาด: ${err.message}</div>`;
  }
}
