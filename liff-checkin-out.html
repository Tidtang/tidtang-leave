<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TIDTANG — Check In / Out</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --deep:#191919;--dark:#242424;--mid:#2e2e2e;--border:#383838;
  --off:#EBE7E4;--cream:#C8B8A2;--muted:#666;
  --green:#4caf50;--red:#e03535;--amber:#e8a020;--blue:#3b82f6;--r:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Anuphan',sans-serif;background:var(--deep);color:var(--off);min-height:100vh}

.loading{position:fixed;inset:0;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100}
.spin{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--cream);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:12px;color:var(--muted);letter-spacing:.1em}

.header{background:var(--dark);border-bottom:1px solid var(--border);padding:16px 20px}
.header-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);margin-bottom:2px}
.header-title{font-size:20px;font-weight:800}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px}

.user-chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:8px;padding:10px 14px;margin:12px 20px 0}
.av{width:32px;height:32px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--deep);flex-shrink:0}
.u-name{font-size:13px;font-weight:700}
.u-role{font-size:10px;color:var(--muted)}

.body{padding:20px;display:flex;flex-direction:column;gap:14px}
.sec-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* Active card */
.active-card{border-radius:var(--r);padding:16px;border:1.5px solid var(--green);background:rgba(76,175,80,.08);margin-bottom:4px}
.active-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.active-time{font-size:22px;font-weight:800;letter-spacing:-1px}
.active-sub{font-size:12px;color:var(--muted);margin-top:2px}
.active-method{font-size:10px;color:var(--cream);margin-top:6px;font-family:'IBM Plex Mono',monospace}

/* Buttons */
.btn{width:100%;padding:16px;border:none;border-radius:var(--r);font-family:'Anuphan',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-checkin{background:var(--cream);color:var(--deep)}
.btn-checkout{background:#434343;color:var(--off)}
.btn-emergency{background:transparent;border:1.5px solid var(--border);color:var(--off);font-size:14px;padding:13px}
.btn-contact{background:transparent;border:1.5px solid var(--border);color:var(--off);font-size:14px;padding:13px}
.btn-retry{background:var(--mid);border:1.5px solid var(--border);color:var(--off);font-size:14px;padding:13px}
.btn-late{background:var(--mid);border:1.5px solid var(--border);color:var(--off);font-size:15px}

/* Password screen */
.pwd-card{background:var(--dark);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.pwd-title{font-size:15px;font-weight:700;margin-bottom:6px}
.pwd-sub{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.inp{width:100%;background:var(--mid);border:1.5px solid var(--border);border-radius:8px;padding:14px;color:var(--off);font-family:'Anuphan',sans-serif;font-size:16px}
.inp:focus{outline:none;border-color:var(--cream)}
.inp.err{border-color:var(--red)}
.remember-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.remember-row input{width:18px;height:18px;cursor:pointer}

/* Emergency screen */
.emergency-card{background:var(--dark);border:1.5px solid var(--amber);border-radius:var(--r);padding:16px;margin-bottom:14px}
.emergency-title{font-size:14px;font-weight:700;color:var(--amber);margin-bottom:4px}
.emergency-sub{font-size:12px;color:var(--muted);line-height:1.6}
.reason-grid{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.reason-btn{padding:12px;background:var(--mid);border:1.5px solid var(--border);border-radius:8px;color:var(--off);font-family:'Anuphan',sans-serif;font-size:13px;cursor:pointer;text-align:left}
.reason-btn.selected{border-color:var(--amber);background:rgba(232,160,32,.1);color:var(--amber)}

/* Status */
.status-card{background:var(--dark);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.status-icon{font-size:36px;margin-bottom:8px}
.status-title{font-size:18px;font-weight:800;margin-bottom:6px}
.status-sub{font-size:13px;color:var(--muted);line-height:1.7}

/* Alert */
.alert{border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:12px;line-height:1.6}
.alert-err{background:rgba(224,53,53,.12);border:1px solid var(--red);color:#fca5a5}
.alert-ok{background:rgba(76,175,80,.12);border:1px solid var(--green);color:#86efac}
.alert-warn{background:rgba(232,160,32,.12);border:1px solid var(--amber);color:#fcd34d}

.divider{height:1px;background:var(--border);margin:4px 0}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spin"></div>
  <div class="load-txt" id="load-txt">กำลังโหลด...</div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <div class="header-tag">TIDTANG STUDIO</div>
    <div class="header-title">Check In / Out</div>
    <div class="header-sub" id="hdr-date"></div>
  </div>
  <div class="user-chip">
    <div class="av" id="av"></div>
    <div>
      <div class="u-name" id="u-name">—</div>
      <div class="u-role" id="u-role">—</div>
    </div>
  </div>
  <div class="body" id="body"></div>
</div>

<script>
const LIFF_ID    = "2010134572-hkPA2Wuf";
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwx-5qK1LrU7RjkaleQVYQ5GVCCe9Ab3_uoC7zE9gtj_0dKoXf86PyiHOhFmBVeN3Zm4g/exec";
const WIFI_PWD_KEY = "tidtang_wifi_pwd";
const OFFICE_SUBNETS = ["192.168.11.", "192.168.14."];

let userId = null, emp = null, activeCheckin = null;

// ── Init ────────────────────────────────────────────────────────
async function init() {
  try {
    setLoad("เชื่อมต่อ Line...");
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    setLoad("ดึงข้อมูล...");
    const profile = await liff.getProfile();
    userId = profile.userId;

    const res  = await fetch(`${WEBAPP_URL}?action=getAttendanceStatus&userId=${encodeURIComponent(userId)}`);
    const data = await res.json();

    if (!data.success || !data.emp) {
      setLoad("ไม่พบข้อมูลในระบบค่ะ กรุณาลงทะเบียนก่อนนะคะ"); return;
    }

    emp = data.emp;
    activeCheckin = data.activeCheckin;

    hide("loading");
    document.getElementById("app").style.display = "block";

    // Header
    const now = new Date();
    document.getElementById("hdr-date").textContent =
      `${now.toLocaleDateString("th-TH", {weekday:"long",day:"numeric",month:"long",year:"numeric"})}`;
    document.getElementById("av").textContent = (emp.nick||"?").substring(0,2).toUpperCase();
    document.getElementById("u-name").textContent = emp.nick || "—";
    document.getElementById("u-role").textContent = `${emp.pos || ""} · ${emp.dept || ""}`;

    renderMain();
  } catch(err) {
    setLoad("เกิดข้อผิดพลาด: " + err.message);
  }
}

// ── Main screen ─────────────────────────────────────────────────
function renderMain() {
  const body = document.getElementById("body");
  const now  = new Date();
  const timeStr = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});

  if (activeCheckin) {
    // มี Check In อยู่ → แสดง Check Out
    const isOnSite = activeCheckin.mode === "onsite";
    body.innerHTML = `
      <div>
        <div class="sec-label">สถานะปัจจุบัน</div>
        <div class="active-card">
          <div class="active-badge">กำลังทำงาน</div>
          <div class="active-time">${activeCheckin.timeIn || "—"} น.</div>
          <div class="active-sub">Check In แล้ว · ${isOnSite ? "On Site" : "Office"}</div>
          <div class="active-method">Method: ${activeCheckin.method || "WiFi Verified"}</div>
        </div>
      </div>
      <div class="sec-label">Check Out</div>
      ${isOnSite
        ? `<button class="btn btn-checkout" onclick="startCheckOutOnSite()">Check Out On Site</button>`
        : `<button class="btn btn-checkout" onclick="startCheckOut()">Check Out ตอนนี้</button>
           <button class="btn btn-emergency" style="margin-top:8px" onclick="showEmergencyOut()">Emergency Check Out</button>
           <button class="btn btn-contact" style="margin-top:8px" onclick="showContactAdmin()">ติดต่อ Admin / HR</button>`
      }`;
  } else {
    // ยังไม่ได้ Check In
    body.innerHTML = `
      <div class="sec-label">Check In</div>
      <button class="btn btn-checkin" style="margin-bottom:10px" onclick="startCheckIn()">Check In Office</button>
      <button class="btn btn-late" onclick="startCheckInOnSite()">Check In On Site</button>
      <div class="divider" style="margin-top:10px"></div>`;
  }
}

// ── CHECK IN FLOW ────────────────────────────────────────────────
async function startCheckIn() {
  showPasswordScreen("checkin");
}

function showPasswordScreen(mode) {
  const body = document.getElementById("body");
  body.innerHTML = `
    <div class="pwd-card">
      <div class="pwd-title">ยืนยันเครือข่ายบริษัท</div>
      <div class="pwd-sub">กรอกรหัส WiFi ออฟฟิศเพื่อยืนยันว่าคุณอยู่ที่บริษัทค่ะ</div>
      <input class="inp" id="pwd-inp" type="password" placeholder="รหัส WiFi ออฟฟิศ" autocomplete="off">

    </div>
    <div id="alert-box"></div>
    <button class="btn btn-checkin" onclick="submitPassword('${mode}')">ยืนยัน</button>
    <button class="btn btn-emergency" style="margin-top:8px" onclick="showEmergencyIn()">Emergency Check In</button>
    <button class="btn btn-retry" style="margin-top:8px" onclick="renderMain()">ยกเลิก</button>`;

  document.getElementById("pwd-inp").focus();
}

async function submitPassword(mode) {
  const pwd = document.getElementById("pwd-inp").value.trim();
  if (!pwd) { showAlert("err", "กรุณากรอกรหัส WiFi ค่ะ"); return; }

  if (mode === "checkin") {
    await verifyAndCheckIn(pwd);
  } else {
    await verifyAndCheckOut(pwd);
  }
}

async function verifyAndCheckIn(pwd) {
  showLoading("กำลังตรวจสอบเครือข่ายและตำแหน่ง...");

  try {
    const now = new Date();
    const timeIn = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});

    // ดึง GPS ก่อนส่ง
    let lat = null, lng = null;
    try {
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject,
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
      });
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
    } catch(gpsErr) {
      // GPS ไม่ได้ → block ทันที ไม่อนุญาตให้ผ่าน
      hide("loading");
      document.getElementById("app").style.display = "block";
      showWifiError();
      return;
    }

    const res = await fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({
        action: "attendanceCheckin",
        userId, mode: "office",
        wifiPwd: pwd,
        lat, lng,
        timeIn,
        method: "WiFi+GPS"
      })
    });
    const data = await res.json();

    hide("loading");
    document.getElementById("app").style.display = "block";

    if (data.success) {
      activeCheckin = { timeIn, mode: "office", method: "WiFi Verified" };
      showSuccess("checkin", timeIn);
    } else if (data.wrongPwd) {
      // รหัสผิด
      showWifiError();
    } else {
      renderMain();
      showAlertInBody("err", data.msg || "เกิดข้อผิดพลาดค่ะ");
    }
  } catch(err) {
    hide("loading");
    document.getElementById("app").style.display = "block";
    renderMain();
    showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
  }
}

function showWifiError() {
  const body = document.getElementById("body");
  body.innerHTML = `
    <div class="alert alert-warn">ไม่พบเครือข่ายบริษัทค่ะ<br>หากคุณอยู่ที่ออฟฟิศและพบปัญหาเครือข่าย กรุณาเลือก "Emergency Check In"</div>
    <button class="btn btn-retry" onclick="showPasswordScreen('checkin')">ลองอีกครั้ง</button>
    <button class="btn btn-emergency" style="margin-top:8px" onclick="showEmergencyIn()">Emergency Check In</button>`;
}

// ── EMERGENCY CHECK IN ───────────────────────────────────────────
function showEmergencyIn() {
  renderEmergencyScreen("checkin");
}

function showEmergencyOut() {
  renderEmergencyScreen("checkout");
}

let selectedReason = "";
let emergencyPhoto = null;
let emergencyGPS   = null;

function renderEmergencyScreen(mode) {
  selectedReason = "";
  emergencyPhoto = null;
  emergencyGPS   = null;

  const title = mode === "checkin" ? "Emergency Check In" : "Emergency Check Out";
  const body  = document.getElementById("body");

  body.innerHTML = `
    <div class="emergency-card">
      <div class="emergency-title">${title}</div>
      <div class="emergency-sub">ระบบไม่สามารถตรวจสอบเครือข่ายได้ กรุณาให้ข้อมูลเพิ่มเติมค่ะ</div>
    </div>

    <div class="sec-label">เหตุผล</div>
    <div class="reason-grid">
      ${["WiFi มีปัญหา","อินเทอร์เน็ตขัดข้อง","ระบบไม่สามารถตรวจสอบเครือข่ายได้","อื่นๆ"]
        .map(r => `<button class="reason-btn" onclick="selectReason(this,'${r}')">${r}</button>`).join("")}
    </div>

    <div class="sec-label">ถ่ายรูปปัจจุบัน</div>
    <div style="margin-bottom:14px">
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="onPhotoSelected(this)">
      <button class="btn btn-retry" onclick="document.getElementById('photo-input').click()">ถ่ายรูป (ต้องถ่ายใหม่เท่านั้น)</button>
      <div id="photo-preview" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>
    </div>

    <div id="alert-box"></div>
    <button class="btn btn-emergency" onclick="submitEmergency('${mode}')" id="btn-emergency-submit" disabled>
      ส่ง Emergency ${mode === "checkin" ? "Check In" : "Check Out"}
    </button>
    <button class="btn btn-retry" style="margin-top:8px" onclick="renderMain()">ยกเลิก</button>`;

  // ขอ GPS ทันที
  getGPS();
}

function selectReason(el, reason) {
  document.querySelectorAll(".reason-btn").forEach(b => b.classList.remove("selected"));
  el.classList.add("selected");
  selectedReason = reason;
  checkEmergencyReady();
}

function onPhotoSelected(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    // ตรวจว่าถ่ายใหม่ (ไม่ใช่จาก album) — capture=environment บังคับใช้กล้องแล้ว
    emergencyPhoto = file;
    document.getElementById("photo-preview").textContent = `รูปที่เลือก: ${file.name}`;
    checkEmergencyReady();
  }
}

function getGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => {
      emergencyGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      checkEmergencyReady();
    },
    err => { console.log("GPS error:", err); }
  );
}

function checkEmergencyReady() {
  const btn = document.getElementById("btn-emergency-submit");
  if (btn) btn.disabled = !(selectedReason && emergencyPhoto);
}

async function submitEmergency(mode) {
  if (!selectedReason || !emergencyPhoto) return;

  const now = new Date();
  const timeStr = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});

  // Convert photo to base64
  const reader = new FileReader();
  reader.onload = async (e) => {
    const photoBase64 = e.target.result.split(",")[1];

    try {
      const res = await fetch(WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify({
          action: mode === "checkin" ? "emergencyCheckin" : "emergencyCheckout",
          userId,
          time: timeStr,
          reason: selectedReason,
          lat: emergencyGPS?.lat || null,
          lng: emergencyGPS?.lng || null,
          photo: photoBase64,
          method: "Emergency"
        })
      });
      const data = await res.json();

      if (data.success) {
        // save activeCheckin เพื่อให้แสดงปุ่ม Check Out
        if (mode === "checkin") {
          activeCheckin = { timeIn: timeStr, mode: "office", method: "Emergency" };
        } else {
          activeCheckin = null;
        }
        showEmergencySuccess(mode);
      } else if (data.outOfRange) {
        // นอกรัศมีออฟฟิศ
        const body = document.getElementById("body");
        body.innerHTML = `
          <div class="alert alert-err" style="white-space:pre-line">${data.msg}</div>
          <button class="btn btn-retry" onclick="renderMain()">กลับหน้าหลัก</button>`;
      } else {
        showAlertInBody("err", data.msg || "เกิดข้อผิดพลาดค่ะ");
      }
    } catch(err) {
      showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
    }
  };
  reader.readAsDataURL(emergencyPhoto);
}

// ── CHECK IN ON SITE ────────────────────────────────────────────
let onsiteGPS = null;
let onsiteProjectName = "";

function startCheckInOnSite() {
  const body = document.getElementById("body");
  onsiteGPS = null;

  body.innerHTML = `
    <div class="sec-label">Check In On Site</div>
    <div class="pwd-card">
      <div class="pwd-title">ชื่อโปรเจกต์ / สถานที่</div>
      <input class="inp" id="onsite-project" type="text" placeholder="เช่น บ้านคุณสมชาย, Site A" style="margin-bottom:10px">
      <div id="gps-status" class="alert alert-warn" style="display:none">กำลังดึง GPS...</div>
    </div>
    <div id="alert-box"></div>
    <button class="btn btn-checkin" id="btn-onsite-submit" onclick="submitCheckInOnSite()" disabled>Check In On Site</button>
    <button class="btn btn-retry" style="margin-top:8px" onclick="renderMain()">ยกเลิก</button>`;

  // ดึง GPS ทันที
  getOnsiteGPS();
}

function getOnsiteGPS() {
  const statusEl = document.getElementById("gps-status");
  if (statusEl) { statusEl.style.display="block"; statusEl.textContent="กำลังดึง GPS..."; }

  navigator.geolocation.getCurrentPosition(
    pos => {
      onsiteGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (statusEl) {
        statusEl.className = "alert alert-ok";
        statusEl.textContent = `GPS พร้อมแล้วค่ะ (${onsiteGPS.lat.toFixed(5)}, ${onsiteGPS.lng.toFixed(5)})`;
      }
      const btn = document.getElementById("btn-onsite-submit");
      if (btn) btn.disabled = false;
    },
    err => {
      if (statusEl) {
        statusEl.className = "alert alert-err";
        statusEl.textContent = "ดึง GPS ไม่ได้ค่ะ กรุณาเปิด Location แล้วลองใหม่";
      }
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

async function submitCheckInOnSite() {
  const project = document.getElementById("onsite-project").value.trim();
  if (!project) { showAlert("err", "กรุณากรอกชื่อโปรเจกต์ค่ะ"); return; }
  if (!onsiteGPS) { showAlert("err", "ยังไม่ได้รับ GPS ค่ะ"); return; }

  const now    = new Date();
  const timeIn = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});

  showLoading("กำลัง Check In On Site...");
  try {
    const res = await fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({
        action: "onsiteAttendanceCheckin",
        userId,
        lat: onsiteGPS.lat,
        lng: onsiteGPS.lng,
        projectName: project,
        timeIn
      })
    });
    const data = await res.json();

    hide("loading");
    document.getElementById("app").style.display = "block";

    if (data.success) {
      activeCheckin = { timeIn, mode: "onsite", method: "GPS" };
      const body = document.getElementById("body");
      body.innerHTML = `
        <div class="status-card">
          <div class="status-title">Check In On Site เรียบร้อยค่ะ</div>
          <div class="status-sub">${timeIn} น. · ${project}

ขอให้งานราบรื่นนะคะ</div>
        </div>
        <button class="btn btn-retry" style="margin-top:8px" onclick="liff.closeWindow()">ปิด</button>`;
    } else {
      renderMain();
      showAlertInBody("err", data.msg || "เกิดข้อผิดพลาดค่ะ");
    }
  } catch(err) {
    hide("loading");
    document.getElementById("app").style.display = "block";
    renderMain();
    showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
  }
}

// ── CHECK OUT ON SITE ────────────────────────────────────────────
let onsiteCheckoutPhoto = null;
let onsiteCheckoutGPS   = null;

function startCheckOutOnSite() {
  onsiteCheckoutPhoto = null;
  onsiteCheckoutGPS   = null;

  const body = document.getElementById("body");
  body.innerHTML = `
    <div class="emergency-card" style="border-color:var(--blue)">
      <div class="emergency-title" style="color:var(--blue)">Check Out On Site</div>
      <div class="emergency-sub">กรุณาถ่ายรูปเพื่อยืนยันการ Check Out ค่ะ</div>
    </div>

    <div class="sec-label">ถ่ายรูปปัจจุบัน</div>
    <div style="margin-bottom:14px">
      <input type="file" id="onsite-out-photo" accept="image/*" capture="environment" style="display:none" onchange="onOnsiteOutPhoto(this)">
      <button class="btn btn-retry" onclick="document.getElementById('onsite-out-photo').click()">ถ่ายรูป (ต้องถ่ายใหม่เท่านั้น)</button>
      <div id="onsite-out-preview" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>
    </div>

    <div id="gps-out-status" class="alert alert-warn">กำลังดึง GPS...</div>
    <div id="alert-box"></div>
    <button class="btn btn-checkout" id="btn-onsite-out-submit" onclick="submitCheckOutOnSite()" disabled style="margin-top:12px">
      Check Out On Site
    </button>
    <button class="btn btn-retry" style="margin-top:8px" onclick="renderMain()">ยกเลิก</button>`;

  // ดึง GPS ทันที
  navigator.geolocation.getCurrentPosition(
    pos => {
      onsiteCheckoutGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const el = document.getElementById("gps-out-status");
      if (el) { el.className = "alert alert-ok"; el.textContent = `GPS พร้อมแล้วค่ะ`; }
      checkOnsiteOutReady();
    },
    err => {
      const el = document.getElementById("gps-out-status");
      if (el) { el.className = "alert alert-err"; el.textContent = "ดึง GPS ไม่ได้ค่ะ กรุณาเปิด Location"; }
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function onOnsiteOutPhoto(input) {
  if (input.files && input.files[0]) {
    onsiteCheckoutPhoto = input.files[0];
    const el = document.getElementById("onsite-out-preview");
    if (el) el.textContent = `รูปที่เลือก: ${input.files[0].name}`;
    checkOnsiteOutReady();
  }
}

function checkOnsiteOutReady() {
  const btn = document.getElementById("btn-onsite-out-submit");
  if (btn) btn.disabled = !(onsiteCheckoutPhoto && onsiteCheckoutGPS);
}

async function submitCheckOutOnSite() {
  if (!onsiteCheckoutPhoto || !onsiteCheckoutGPS) return;

  const now     = new Date();
  const timeOut = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});
  const hour    = now.getHours();

  const reader = new FileReader();
  reader.onload = async (e) => {
    const photoBase64 = e.target.result.split(",")[1];
    showLoading("กำลัง Check Out On Site...");
    try {
      const res = await fetch(WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify({
          action: "attendanceCheckout",
          userId,
          timeOut,
          lat: onsiteCheckoutGPS.lat,
          lng: onsiteCheckoutGPS.lng,
          photo: photoBase64,
          checkoutMethod: "On Site"
        })
      });
      const data = await res.json();

      hide("loading");
      document.getElementById("app").style.display = "block";

      if (data.success) {
        activeCheckin = null;
        showSuccess("checkout", timeOut, hour);
      } else {
        renderMain();
        showAlertInBody("err", data.msg || "เกิดข้อผิดพลาดค่ะ");
      }
    } catch(err) {
      hide("loading");
      document.getElementById("app").style.display = "block";
      renderMain();
      showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
    }
  };
  reader.readAsDataURL(onsiteCheckoutPhoto);
}

// ── CHECK OUT FLOW (Office) ───────────────────────────────────────────
async function startCheckOut() {
  showPasswordScreen("checkout");
}

async function verifyAndCheckOut(pwd) {
  showLoading("กำลังตรวจสอบเครือข่ายและตำแหน่ง...");
  try {
    const now = new Date();
    const timeOut = now.toLocaleTimeString("th-TH", {hour:"2-digit",minute:"2-digit"});
    const hour = now.getHours();

    // ดึง GPS
    let lat = null, lng = null;
    try {
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject,
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
      });
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
    } catch(gpsErr) {
      // GPS ไม่ได้ → block ทันที
      hide("loading");
      document.getElementById("app").style.display = "block";
      showCheckOutWifiError();
      return;
    }

    const res = await fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({
        action: "attendanceCheckout",
        userId,
        timeOut,
        lat, lng,
        wifiPwd: pwd,
        checkoutMethod: "WiFi+GPS"
      })
    });
    const data = await res.json();

    hide("loading");
    document.getElementById("app").style.display = "block";

    if (data.success) {
      activeCheckin = null;
      showSuccess("checkout", timeOut, hour);
    } else if (data.wrongPwd) {
      showCheckOutWifiError();
    } else {
      renderMain();
      showAlertInBody("err", data.msg || "เกิดข้อผิดพลาดค่ะ");
    }
  } catch(err) {
    hide("loading");
    document.getElementById("app").style.display = "block";
    renderMain();
    showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
  }
}

function showCheckOutWifiError() {
  const body = document.getElementById("body");
  body.innerHTML = `
    <div class="alert alert-warn">ไม่พบเครือข่ายบริษัทค่ะ<br>หากออกจากออฟฟิศแล้ว กรุณาติดต่อ HR/Admin</div>
    <button class="btn btn-retry" onclick="startCheckOut()">ลองอีกครั้ง</button>
    <button class="btn btn-emergency" style="margin-top:8px" onclick="showEmergencyOut()">Emergency Check Out</button>
    <button class="btn btn-contact" style="margin-top:8px" onclick="showContactAdmin()">ติดต่อ Admin / HR</button>
    <button class="btn btn-retry" style="margin-top:8px" onclick="renderMain()">ยกเลิก</button>`;
}

// ── SUCCESS SCREENS ──────────────────────────────────────────────
function showSuccess(type, time, hour) {
  const body = document.getElementById("body");
  let title, msg;

  if (type === "checkin") {
    title = "Check In เรียบร้อยค่ะ";
    msg   = `${time} น.\n\nขอให้เป็นวันที่ดีและทำงานอย่างราบรื่นนะคะ`;
  } else {
    const h = hour ?? new Date().getHours();
    if (h >= 0 && h < 3) {
      title = "Check Out เรียบร้อยค่ะ";
      msg   = `${time} น.\n\nขอบคุณที่ทุ่มเทกับงานจนดึกค่ะ\nเดินทางกลับบ้านปลอดภัย และพักผ่อนให้เต็มที่นะคะ`;
    } else if (h >= 3) {
      title = "Check Out เรียบร้อยค่ะ";
      msg   = `${time} น.\n\nแสงแรกของวันกำลังมาแล้ว\nขอบคุณสำหรับความตั้งใจในคืนนี้\nเดินทางกลับบ้านปลอดภัย และอย่าลืมหาเวลาพักผ่อนนะคะ`;
    } else {
      title = "Check Out เรียบร้อยค่ะ";
      msg   = `${time} น.\n\nขอบคุณสำหรับวันนี้ค่ะ เดินทางกลับบ้านปลอดภัยนะคะ`;
    }
  }

  body.innerHTML = `
    <div class="status-card">
      <div class="status-title">${title}</div>
      <div class="status-sub" style="white-space:pre-line">${msg}</div>
    </div>
    <button class="btn btn-retry" style="margin-top:8px" onclick="liff.closeWindow()">ปิด</button>`;
}

// ── ติดต่อ Admin/HR ──────────────────────────────────────────────
function showContactAdmin() {
  const body = document.getElementById("body");
  body.innerHTML = `
    <div class="emergency-card" style="border-color:var(--cream)">
      <div class="emergency-title" style="color:var(--cream)">ติดต่อ Admin / HR</div>
      <div class="emergency-sub">แจ้งเหตุผลที่ไม่สามารถ Check Out ได้ตามปกติค่ะ<br>Admin/HR จะตรวจสอบและติดต่อกลับทาง LINE</div>
    </div>
    <div id="alert-box"></div>
    <textarea class="inp" id="contact-reason" rows="4"
      placeholder="อธิบายสถานการณ์ เช่น ลืม Check Out / มีปัญหาระบบ / อยู่นอกพื้นที่..."
      style="resize:none;line-height:1.6;font-size:14px"
      oninput="document.getElementById('btn-contact-submit').disabled = this.value.trim().length < 5"></textarea>
    <button class="btn btn-contact" id="btn-contact-submit" style="margin-top:10px" disabled
      onclick="submitContactAdmin()">ส่งข้อความหา Admin / HR</button>
    <button class="btn btn-retry" style="margin-top:8px" onclick="renderMain()">ยกเลิก</button>`;
}

async function submitContactAdmin() {
  const reason = document.getElementById("contact-reason").value.trim();
  if (!reason) return;

  const btn = document.getElementById("btn-contact-submit");
  btn.disabled = true;
  btn.textContent = "กำลังส่ง...";

  try {
    const res = await fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({
        action: "contactAdminHR",
        userId,
        reason,
        timeNow: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })
      })
    });
    const data = await res.json();

    if (data.success) {
      const body = document.getElementById("body");
      body.innerHTML = `
        <div class="emergency-card" style="border-color:var(--green)">
          <div class="emergency-title" style="color:var(--green)">ส่งข้อความสำเร็จ</div>
          <div class="emergency-sub">Admin / HR ได้รับแจ้งแล้วค่ะ<br>รอการติดต่อกลับทาง LINE ได้เลยค่ะ</div>
        </div>
        <button class="btn btn-retry" style="margin-top:8px" onclick="liff.closeWindow()">ปิด</button>`;
    } else {
      showAlertInBody("err", data.msg || "เกิดข้อผิดพลาดค่ะ");
      btn.disabled = false;
      btn.textContent = "ส่งข้อความหา Admin / HR";
    }
  } catch(err) {
    showAlertInBody("err", "เชื่อมต่อไม่ได้ค่ะ: " + err.message);
    btn.disabled = false;
    btn.textContent = "ส่งข้อความหา Admin / HR";
  }
}

function showEmergencySuccess(mode) {
  const body = document.getElementById("body");
  body.innerHTML = `
    <div class="status-card">
      <div class="status-title">ระบบได้รับข้อมูลแล้วค่ะ</div>
      <div class="status-sub">รายการนี้จะถูกส่งให้ HR/Admin ตรวจสอบเพิ่มเติมค่ะ\n\nสถานะ: Admin Review</div>
    </div>
    <button class="btn btn-retry" style="margin-top:8px" onclick="liff.closeWindow()">ปิด</button>`;
}

// ── WORKING LATE (จาก Reminder) ─────────────────────────────────
async function confirmWorkingLate() {
  const savedPwd = localStorage.getItem(WIFI_PWD_KEY);
  if (!savedPwd) { showPasswordScreen("late"); return; }

  const res = await fetch(WEBAPP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=UTF-8" },
    body: JSON.stringify({ action: "workingLate", userId, wifiPwd: savedPwd })
  });
  const data = await res.json();

  const body = document.getElementById("body");
  if (data.success) {
    body.innerHTML = `
      <div class="status-card">
        <div class="status-title">รับทราบค่ะ</div>
        <div class="status-sub">ขอให้การทำงานราบรื่น\nและอย่าลืมหาเวลาพักผ่อนนะคะ</div>
      </div>
      <button class="btn btn-checkout" style="margin-top:12px" onclick="startCheckOut()">Check Out เมื่อพร้อม</button>`;
  } else if (data.wrongPwd) {
    localStorage.removeItem(WIFI_PWD_KEY);
    body.innerHTML = `<div class="alert alert-warn">ดูเหมือนว่าคุณออกจากออฟฟิศแล้วค่ะ\nกรุณาติดต่อ HR/Admin</div>`;
  }
}

// ── Helpers ──────────────────────────────────────────────────────
function showLoading(txt) {
  document.getElementById("load-txt").textContent = txt;
  document.getElementById("loading").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function hide(id) { const el=document.getElementById(id); if(el) el.style.display="none"; }
function setLoad(txt) { document.getElementById("load-txt").textContent = txt; }

function showAlertInBody(type, msg) {
  const existing = document.getElementById("body-alert");
  if (existing) existing.remove();
  const el = document.createElement("div");
  el.id = "body-alert";
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  document.getElementById("body").prepend(el);
}

function showAlert(type, msg) {
  const el = document.getElementById("alert-box");
  if (!el) return;
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  el.style.display = "block";
}

window.addEventListener("DOMContentLoaded", () => {
  function waitLiff(cb) {
    if (typeof liff !== "undefined") cb();
    else setTimeout(() => waitLiff(cb), 100);
  }
  waitLiff(init);
});
</script>
